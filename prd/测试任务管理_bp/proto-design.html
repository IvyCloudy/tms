<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>TMS 测试任务管理 — 设计管理</title>
<link rel="stylesheet" href="tms-common.css">
<style>
/* ========== 页面特有样式 ========== */
.scope-select{min-width:240px}
.scope-meta strong{color:#0052d9}
.scope-stage-tag{display:inline-block;padding:2px 8px;font-size:11px;border-radius:2px;margin-left:6px;font-weight:500}
.stage-tag-st{background:#e8f3ff;color:#0052d9}
.stage-tag-uat{background:#f3e8ff;color:#7b3fe4}
.stage-tag-smoke{background:#fff3e0;color:#e37318}
.stage-tag-regression{background:#e8f8f0;color:#2ba471}

/* Tabs */
.tabs-wrap{background:#fff;border:1px solid #e5e9ef;border-radius:6px;overflow:hidden}
.tabs-head{display:flex;border-bottom:1px solid #e5e9ef;padding:0 18px;align-items:center}
.tab-item{padding:13px 20px;font-size:13.5px;color:#666;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500;display:flex;align-items:center;gap:6px}
.tab-item:hover{color:#0052d9}
.tab-item.active{color:#0052d9;border-bottom-color:#0052d9;font-weight:600}
.tab-item .tab-count{background:#f0f2f5;color:#666;font-size:10.5px;padding:0 6px;border-radius:8px;font-weight:400;min-width:18px;text-align:center;line-height:16px}
.tab-item.active .tab-count{background:#e8f3ff;color:#0052d9}
.tab-actions{margin-left:auto;display:flex;gap:8px}

/* 案例列表标题栏（与测试任务列表保持一致） */
.table-header{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid #f0f2f5}
.table-header .table-title{font-size:14px;font-weight:600;color:#1a1a1a}
.table-header .table-title .count{font-size:12px;color:#888;font-weight:400;margin-left:8px}
.table-header .table-actions{display:flex;gap:8px}

.tab-panel{display:none}
.tab-panel.active{display:block}

table{min-width:1100px}

.case-code{color:#0052d9;cursor:pointer;font-family:"SF Mono","Menlo",monospace;font-size:11.5px;font-weight:500}
.case-code:hover{text-decoration:underline}
.case-name{font-weight:500;color:#1a1a1a}
.case-name:hover{color:#0052d9;cursor:pointer}
.case-path{font-size:10.5px;color:#999;margin-top:2px}

.case-type{display:inline-block;padding:1px 7px;font-size:10.5px;border-radius:2px;background:#f0f2f5;color:#666}

.case-status{display:inline-block;padding:2px 8px;font-size:10.5px;border-radius:2px;font-weight:500}
.cs-draft{background:#f0f2f5;color:#888}
.cs-review{background:#fff3e0;color:#e37318}
.cs-approved{background:#e8f8f0;color:#2ba471}
.cs-deprecated{background:#fde2e3;color:#e34d59}

/* ========== 测试大纲 Tab（XMind） ========== */
.mind-toolbar{padding:12px 18px;border-bottom:1px solid #f0f2f5;display:flex;align-items:center;gap:10px}
.mind-toolbar .tools{display:flex;gap:6px}
.mind-toolbar .tip{margin-left:auto;font-size:11.5px;color:#999}

.mind-canvas{position:relative;background:
  radial-gradient(circle,#e8ecf3 1px,transparent 1px) 0 0/18px 18px,
  #fafbfc;
  overflow:auto;padding:40px 30px;min-height:560px}

/* 思维导图节点（树状连线：H 型分叉） */
.xmind{display:inline-flex;align-items:center;min-width:100%}

/* 根节点 */
.node-root{background:linear-gradient(135deg,#0052d9,#003cab);color:#fff;padding:14px 22px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 4px 14px rgba(0,82,217,.3);white-space:nowrap;position:relative;z-index:2;flex-shrink:0}
.node-root .root-sub{display:block;font-size:11px;font-weight:400;opacity:.85;margin-top:3px}

/* 一级节点（模块） */
.node-l1{background:#fff;border:2px solid #0052d9;color:#0052d9;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;transition:all .2s;box-shadow:0 2px 6px rgba(0,0,0,.04);flex-shrink:0}
.node-l1:hover{background:#0052d9;color:#fff;transform:translateX(2px)}
.node-l1 .badge{background:#e8f3ff;color:#0052d9;font-size:10px;padding:1px 5px;border-radius:8px;margin-left:6px;font-weight:500}
.node-l1:hover .badge{background:rgba(255,255,255,.2);color:#fff}

/* 二级节点（案例） */
.node-l2{background:#fff;border:1px solid #dde3ea;color:#333;padding:7px 12px;border-radius:6px;font-size:12.5px;white-space:nowrap;cursor:pointer;transition:all .2s;position:relative;flex-shrink:0}
.node-l2:hover{border-color:#0052d9;color:#0052d9;background:#f0f6ff}
.node-l2 .tag-p{display:inline-block;padding:0 5px;font-size:9.5px;border-radius:2px;margin-right:5px;font-weight:500;vertical-align:middle}

/* ---------- 连线系统 ---------- */
/* 父节点右侧的一条短横线，伸向子节点容器的垂直干线 */
.hline{width:24px;height:2px;background:#c5cbd3;flex-shrink:0;align-self:center}
.hline-root{background:#0052d9;height:2px}

/* 子节点容器：纵向堆叠 + 左侧贯穿垂直干线
   干线通过 ::before 绘制，top/bottom 各留 50% 的首行/末行高度，
   让干线正好从第一个子节点中点连到最后一个子节点中点。 */
.branch-col{position:relative;display:flex;flex-direction:column;gap:14px;padding-left:24px}
.branch-col::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:#c5cbd3;
}
/* 首尾遮罩：用同色"遮罩"盖住首个子节点上半段和末个子节点下半段的干线，
   这样干线视觉上恰好从首行中点开始、末行中点结束。
   通过 .branch-row::before（水平短线）自然从干线接入节点。 */
.branch-col > .branch-row:first-child::after,
.branch-col > .branch-row:last-child::after{
  content:"";position:absolute;left:-24px;width:2px;background:#fafbfc;
}
.branch-col > .branch-row:first-child::after{top:0;height:calc(50% - 1px)}
.branch-col > .branch-row:last-child::after{bottom:0;height:calc(50% - 1px)}
/* 根节点直接输出的分支（子任务→模块），干线用主色 */
.branch-col.root-branch::before{background:#0052d9}
.branch-col.root-branch > .branch-row:first-child::after,
.branch-col.root-branch > .branch-row:last-child::after{background:#fafbfc}

/* 单个子节点行：水平短线 + 节点 */
.branch-row{position:relative;display:flex;align-items:center}
.branch-row > .hline{margin-left:-24px}

/* 一个"模块 → 案例们"的整体（作为 root 的一个子节点，故本身是 branch-row） */
.subtree{display:flex;align-items:center;gap:0}

.legend{display:flex;gap:16px;margin-top:20px;padding:10px 14px;background:#fff;border:1px solid #e5e9ef;border-radius:4px;font-size:11.5px;color:#666;align-items:center}
.legend .lg-item{display:flex;align-items:center;gap:6px}
.legend .lg-box{width:14px;height:14px;border-radius:3px}

/* 折叠图标 */
.fold-ic{display:inline-block;width:14px;height:14px;line-height:12px;text-align:center;border:1px solid currentColor;border-radius:50%;font-size:10px;margin-left:6px;cursor:pointer}
</style>

<script>
/* ============ 联动数据 ============ */
/*  当前任务下的"测试子任务" -> 支持的"测试阶段"  */

/* 测试阶段模板（复用） */
var FULL_STAGES = [
  { code:"smoke",      name:"冒烟测试" },
  { code:"st",         name:"系统测试（ST）" },
  { code:"regression", name:"回归测试" },
  { code:"uat",        name:"用户验收（UAT）" }
];
var STAGES_NO_REG = [FULL_STAGES[0], FULL_STAGES[1], FULL_STAGES[3]];
var STAGES_ST_REG = [FULL_STAGES[1], FULL_STAGES[2]];

/* 按主任务 id 组织的测试子任务 */
var SUBTASKS_BY_TASK = {
  /* T001 支付中心重构测试 */
  "T001": [
    { id:"sub-pay-api",  name:"支付核心 API 重构",        stages: FULL_STAGES },
    { id:"sub-cashier",  name:"收银台前端改版",           stages: STAGES_NO_REG },
    { id:"sub-risk",     name:"风控规则引擎接入",         stages: STAGES_ST_REG },
    { id:"sub-channel",  name:"第三方渠道对接（银联/支付宝）", stages: STAGES_NO_REG }
  ],
  /* T002 会员体系 H5 新增优惠券模块 */
  "T002": [
    { id:"sub-coupon-core",  name:"优惠券核心逻辑",   stages: FULL_STAGES },
    { id:"sub-coupon-ui",    name:"优惠券领取页面 H5", stages: STAGES_NO_REG },
    { id:"sub-coupon-share", name:"优惠券分享与裂变",   stages: STAGES_NO_REG }
  ],
  /* T003 商品搜索算法优化回归测试 */
  "T003": [
    { id:"sub-search-recall", name:"搜索召回算法回归",   stages: STAGES_ST_REG },
    { id:"sub-search-rank",   name:"搜索排序算法回归",   stages: STAGES_ST_REG },
    { id:"sub-search-ui",     name:"搜索结果页面兼容",   stages: FULL_STAGES }
  ],
  /* T004 订单履约系统性能测试 */
  "T004": [
    { id:"sub-fulfill-perf",   name:"履约引擎压测",       stages: [FULL_STAGES[1], FULL_STAGES[2]] },
    { id:"sub-fulfill-break",  name:"履约系统断路测试",   stages: [FULL_STAGES[1]] }
  ],
  /* T005 消息推送服务国际化改造 */
  "T005": [
    { id:"sub-i18n-gateway",  name:"国际化网关测试",    stages: FULL_STAGES },
    { id:"sub-i18n-template", name:"多语言模板渲染",    stages: STAGES_NO_REG }
  ],
  /* T006 用户登录安全增强验收 */
  "T006": [
    { id:"sub-login-mfa",     name:"MFA 多因素认证流程",  stages: STAGES_NO_REG },
    { id:"sub-login-risk",    name:"登录风控拦截",        stages: STAGES_ST_REG }
  ]
};
/* 默认占位（未配置的任务） */
var DEFAULT_SUBTASKS = [
  { id:"sub-default", name:"默认测试子任务", stages: FULL_STAGES }
];
function resolveSubtasks(taskId){
  return SUBTASKS_BY_TASK[taskId] || DEFAULT_SUBTASKS;
}
var SUBTASKS = resolveSubtasks(
  (window.TMSGlobal ? TMSGlobal.getCurrentId() : "T001")
);

/* ============ 案例数据（按 subtask+stage 归类） ============ */
function mkCase(i, name, type, priority, status, owner, scope){
  return {
    id: "CASE-" + (2600 + i),
    name: name,
    path: scope.subName + " / " + scope.stageName,
    type: type, priority: priority, status: status,
    owner: owner,
    subtask: scope.subId, stage: scope.stageCode,
    updated: "2026-04-" + (10 + (i % 15)).toString().padStart(2, "0") + " " + (10 + i%8) + ":30"
  };
}
var OWNERS = [
  {name:"张小明", short:"张", color:"#0052d9"},
  {name:"李工程师", short:"李", color:"#2ba471"},
  {name:"王测试", short:"王", color:"#7b3fe4"},
  {name:"赵架构师", short:"赵", color:"#e37318"},
  {name:"孙小红", short:"孙", color:"#d64b8a"}
];
var STATUSES = [
  {c:"draft", t:"草稿"}, {c:"review", t:"评审中"},
  {c:"approved", t:"已通过"}, {c:"approved", t:"已通过"},
  {c:"approved", t:"已通过"}, {c:"deprecated", t:"已废弃"}
];

/*
 * 案例池（模拟）：每个 subtask + stage 的组合生成若干案例
 * 真实业务会从后端按 (subtask, stage) 查询
 */
var ALL_CASES = [];
(function(){
  var tpl = {
    "sub-pay-api": {
      smoke: ["创建支付订单-主流程可用","查询订单状态-返回正常","支付回调通知-签名校验"],
      st: [
        "支付订单创建-正常金额","支付订单创建-金额为0","支付订单创建-超过上限金额",
        "支付订单创建-并发幂等","支付渠道路由-默认通道","支付渠道路由-主通道异常降级",
        "退款申请-全额退款","退款申请-部分退款","退款申请-超额拒绝",
        "查询订单-按订单号","查询订单-按商户单号","订单状态机-状态流转校验",
        "支付回调-重复通知幂等","支付回调-签名篡改拒绝"
      ],
      regression: [
        "历史订单查询兼容","旧版回调协议兼容","MySQL 分库分表路由回归"
      ],
      uat: [
        "业务方对账单生成","业务方对账差异确认","UAT 环境全链路支付"
      ]
    },
    "sub-cashier": {
      smoke: ["收银台首屏渲染","支付方式切换"],
      st: [
        "收银台-金额展示正确","收银台-优惠券选择","收银台-优惠券互斥校验",
        "收银台-支付方式排序","收银台-超时倒计时","收银台-重复提交拦截",
        "收银台-移动端适配","收银台-网络异常重试"
      ],
      uat: ["业务方收银台走查","视觉还原度验收"]
    },
    "sub-risk": {
      st: [
        "风控规则命中-黑名单拦截","风控规则命中-高风险二次验证",
        "风控规则命中-白名单放行","风控规则-规则优先级","风控规则-异步决策超时兜底"
      ],
      regression: ["历史风控规则兼容","决策日志回归"]
    },
    "sub-channel": {
      smoke: ["银联通道连通性","支付宝通道连通性"],
      st: [
        "银联-代扣签约","银联-代扣支付","银联-代扣解约",
        "支付宝-扫码支付","支付宝-退款","支付宝-异步通知"
      ],
      uat: ["渠道方联调-银联","渠道方联调-支付宝"]
    }
  };
  var i = 0;
  SUBTASKS.forEach(function(sub){
    sub.stages.forEach(function(st){
      var names = (tpl[sub.id] && tpl[sub.id][st.code]) || [];
      names.forEach(function(nm){
        i++;
        var type = /性能|并发|超时/.test(nm) ? "性能"
                 : /签名|拦截|白名单|黑名单|风控/.test(nm) ? "安全"
                 : /接口|API|回调|通知/.test(nm) ? "接口"
                 : /移动端|适配|兼容/.test(nm) ? "兼容"
                 : "功能";
        var pri = /主流程|签约|回调|首屏|创建|退款|风控|超时|异常|并发/.test(nm) ? "高"
               : /查询|切换|排序/.test(nm) ? "中" : "低";
        var status = STATUSES[i % STATUSES.length];
        var owner = OWNERS[i % OWNERS.length];
        ALL_CASES.push(mkCase(i, nm, type, pri, status.c, owner, {
          subId: sub.id, subName: sub.name, stageCode: st.code, stageName: st.name
        }));
        // 同步扩充 status 文案（因 STATUSES 中 c/t 对应）
        ALL_CASES[ALL_CASES.length-1].statusText = status.t;
      });
    });
  });
})();

/* ============ 状态 ============ */
var state = {
  subtask: "sub-pay-api",
  stage: "st",
  tab: "case",
  // 案例
  caseKw: "", casePage: 1, casePageSize: 10,
  casePriority: "", caseType: "", caseStatus: ""
};

/* ============ 工具 ============ */
function escapeHtml(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function priCls(p){
  return p === "高" ? "pri-high" : p === "中" ? "pri-mid" : "pri-low";
}
function highlight(text, kw){
  var safe = escapeHtml(text);
  if(!kw) return safe;
  var k = kw.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return safe.replace(new RegExp(k, "gi"), function(m){ return "<mark>" + m + "</mark>"; });
}
function stageTagClass(code){
  return code === "st" ? "stage-tag-st"
       : code === "uat" ? "stage-tag-uat"
       : code === "smoke" ? "stage-tag-smoke"
       : "stage-tag-regression";
}

/* ============ 联动下拉 ============ */
function initSubtaskOptions(){
  var sel = document.getElementById("selSubtask");
  sel.innerHTML = SUBTASKS.map(function(s){
    return '<option value="' + s.id + '">' + s.name + '</option>';
  }).join("");
  // 先尝试按全局 scope 中保存的子任务名匹配
  if(window.TMSScope){
    var m = TMSScope.pickMatch(SUBTASKS, function(s){ return s.name; }, TMSScope.getSubtaskName());
    if(m) state.subtask = m.id;
  }
  if(!SUBTASKS.find(function(s){ return s.id === state.subtask; })){
    state.subtask = SUBTASKS[0] ? SUBTASKS[0].id : "";
  }
  sel.value = state.subtask;
  // 回写全局
  if(window.TMSScope){
    var cur = SUBTASKS.find(function(s){ return s.id === state.subtask; });
    if(cur) TMSScope.setSubtaskName(cur.name);
  }
}
function renderStageOptions(){
  var sub = SUBTASKS.find(function(s){ return s.id === state.subtask; });
  var sel = document.getElementById("selStage");
  if(!sub){ sel.innerHTML = ""; sel.disabled = true; return; }
  sel.disabled = false;
  sel.innerHTML = sub.stages.map(function(st){
    return '<option value="' + st.code + '">' + st.name + '</option>';
  }).join("");
  // 先尝试按全局 scope 中保存的阶段名匹配
  if(window.TMSScope){
    var m = TMSScope.pickMatch(sub.stages, function(s){ return s.name; }, TMSScope.getStageName());
    if(m) state.stage = m.code;
  }
  // 若当前 stage 不在新子任务的 stages 列表中，重置为第一个
  if(!sub.stages.find(function(s){ return s.code === state.stage; })){
    state.stage = sub.stages[0] ? sub.stages[0].code : "";
  }
  sel.value = state.stage;
  // 回写全局
  if(window.TMSScope){
    var curStage = sub.stages.find(function(s){ return s.code === state.stage; });
    if(curStage) TMSScope.setStageName(curStage.name);
  }
}

/* ============ 按范围筛选案例 ============ */
function casesInScope(){
  return ALL_CASES.filter(function(c){
    return c.subtask === state.subtask && c.stage === state.stage;
  });
}
function caseFilteredList(){
  var kw = state.caseKw.trim().toLowerCase();
  return casesInScope().filter(function(c){
    if(state.casePriority && c.priority !== state.casePriority) return false;
    if(state.caseType && c.type !== state.caseType) return false;
    if(state.caseStatus && c.status !== state.caseStatus) return false;
    if(kw){
      var hay = (c.name + " " + c.id + " " + c.owner.name).toLowerCase();
      if(hay.indexOf(kw) < 0) return false;
    }
    return true;
  });
}

/* ============ 范围统计 ============ */
function renderScopeMeta(){
  var list = casesInScope();
  var metaCaseEl = document.getElementById("metaCase");
  if(metaCaseEl) metaCaseEl.innerText = list.length;
  document.getElementById("tabCaseCount").innerText = list.length;
  // 大纲节点 = 一级模块 + 二级案例 + 根节点 1
  var modules = buildMindTree();
  var n = 1;
  modules.forEach(function(m){ n += 1 + m.children.length; });
  var metaOutlineEl = document.getElementById("metaOutline");
  if(metaOutlineEl) metaOutlineEl.innerText = n;
  document.getElementById("tabMindCount").innerText = modules.length;
}

/* ============ 案例表格 ============ */
function renderCaseTable(){
  var list = caseFilteredList();
  var total = list.length;
  var countEl = document.getElementById("caseListCount");
  if(countEl) countEl.innerText = "共 " + total + " 条";
  var totalPages = Math.max(1, Math.ceil(total / state.casePageSize));
  if(state.casePage > totalPages) state.casePage = totalPages;
  var start = (state.casePage - 1) * state.casePageSize;
  var pageData = list.slice(start, start + state.casePageSize);

  var tbody = document.getElementById("caseTbody");
  var empty = document.getElementById("caseEmpty");
  if(pageData.length === 0){
    tbody.innerHTML = "";
    empty.style.display = "block";
  }else{
    empty.style.display = "none";
    tbody.innerHTML = pageData.map(function(c){
      return '<tr>' +
        '<td><input type="checkbox" class="row-check"></td>' +
        '<td><span class="case-code">' + highlight(c.id, state.caseKw) + '</span></td>' +
        '<td>' +
          '<div class="case-name">' + highlight(c.name, state.caseKw) + '</div>' +
          '<div class="case-path">' + escapeHtml(c.path) + '</div>' +
        '</td>' +
        '<td><span class="priority ' + priCls(c.priority) + '">' + c.priority + '</span></td>' +
        '<td><span class="case-type">' + c.type + '</span></td>' +
        '<td><span class="case-status cs-' + c.status + '">' + c.statusText + '</span></td>' +
        '<td>' +
          '<span class="owner-cell">' +
            '<span class="avatar-mini" style="background:' + c.owner.color + '">' + c.owner.short + '</span>' +
            highlight(c.owner.name, state.caseKw) +
          '</span>' +
        '</td>' +
        '<td><span style="font-size:12px;color:#666">' + c.updated + '</span></td>' +
        '<td>' +
          '<span class="op-link">查看</span>' +
          '<span class="op-link">编辑</span>' +
          '<span class="op-link">···</span>' +
        '</td>' +
      '</tr>';
    }).join("");
  }
  renderCasePagination(total, totalPages);
}
function renderCasePagination(total, totalPages){
  var p = state.casePage;
  var html = '<span class="pg-total">共 ' + total + ' 条</span>';
  html += '<button class="page-btn" ' + (p === 1 ? "disabled" : "") + ' data-go="prev">‹</button>';
  var pages = [];
  for(var i = 1; i <= totalPages; i++){
    if(i === 1 || i === totalPages || (i >= p - 2 && i <= p + 2)) pages.push(i);
    else if(pages[pages.length - 1] !== "...") pages.push("...");
  }
  pages.forEach(function(pg){
    if(pg === "..."){ html += '<span style="padding:0 4px;color:#999">···</span>'; }
    else html += '<button class="page-btn ' + (pg === p ? "active" : "") + '" data-go="' + pg + '">' + pg + '</button>';
  });
  html += '<button class="page-btn" ' + (p >= totalPages ? "disabled" : "") + ' data-go="next">›</button>';
  html += '<select class="page-size" id="casePageSize">' +
    [10, 20, 50].map(function(n){
      return '<option value="' + n + '" ' + (n === state.casePageSize ? "selected" : "") + '>' + n + ' 条/页</option>';
    }).join("") + '</select>';

  var bar = document.getElementById("casePg");
  bar.innerHTML = html;
  bar.querySelectorAll(".page-btn").forEach(function(btn){
    btn.addEventListener("click", function(){
      var go = btn.getAttribute("data-go");
      if(go === "prev") state.casePage = Math.max(1, state.casePage - 1);
      else if(go === "next") state.casePage = Math.min(totalPages, state.casePage + 1);
      else state.casePage = parseInt(go, 10);
      renderCaseTable();
    });
  });
  document.getElementById("casePageSize").addEventListener("change", function(e){
    state.casePageSize = parseInt(e.target.value, 10);
    state.casePage = 1;
    renderCaseTable();
  });
}

/* ============ 测试大纲（XMind） ============ */
/* 把当前范围的案例按"模块"分组构建树：
   root = 子任务+阶段
   ├─ 模块1（来自案例名前缀，按 "-" 切割）
   │   ├─ 案例a
   │   └─ 案例b
   └─ 模块2
*/
function buildMindTree(){
  var list = casesInScope();
  var groups = {};
  list.forEach(function(c){
    var m = c.name.split("-")[0].trim() || "其他";
    if(!groups[m]) groups[m] = [];
    groups[m].push(c);
  });
  return Object.keys(groups).map(function(k){
    return { name:k, children: groups[k] };
  });
}
function renderMind(){
  var sub = SUBTASKS.find(function(s){ return s.id === state.subtask; });
  var stage = sub ? sub.stages.find(function(s){ return s.code === state.stage; }) : null;
  var modules = buildMindTree();
  var canvas = document.getElementById("mindCanvas");

  if(modules.length === 0){
    canvas.innerHTML = '<div class="empty-state"><div class="empty-icon">◌</div>' +
      '<div class="empty-text">当前范围暂无案例，无法生成大纲</div></div>';
    return;
  }

  /* 渲染结构（H 型连线）：
     [root] ─┬─ [模块1] ─┬─ [案例]
             │          ├─ [案例]
             │          └─ [案例]
             └─ [模块2] ─┬─ [案例]
                        └─ [案例]
  */
  var rootHtml =
    '<div class="node-root">' +
      escapeHtml(sub ? sub.name : "子任务") +
      '<span class="root-sub">' + escapeHtml(stage ? stage.name : "阶段") +
      ' · 共 ' + modules.reduce(function(s,m){return s+m.children.length;},0) + ' 个案例</span>' +
    '</div>';

  // 模块(l1) 下的案例(l2) 列表
  function renderCases(cases){
    if(cases.length === 0) return "";
    var rows = cases.map(function(c){
      var priClass = priCls(c.priority);
      return '<div class="branch-row">' +
        '<div class="hline"></div>' +
        '<div class="node-l2" title="' + escapeHtml(c.id) + ' · ' + escapeHtml(c.statusText) + '">' +
          '<span class="tag-p ' + priClass + '">' + c.priority + '</span>' +
          escapeHtml(c.name) +
        '</div>' +
      '</div>';
    }).join("");
    return '<div class="branch-col">' + rows + '</div>';
  }

  // 每个模块作为 root 的一个子节点（branch-row）
  var modulesHtml = modules.map(function(m){
    return '<div class="branch-row">' +
      '<div class="hline hline-root"></div>' +
      '<div class="subtree">' +
        '<div class="node-l1">' +
          escapeHtml(m.name) +
          '<span class="badge">' + m.children.length + '</span>' +
        '</div>' +
        (m.children.length ? '<div class="hline"></div>' : '') +
        renderCases(m.children) +
      '</div>' +
    '</div>';
  }).join("");

  canvas.innerHTML =
    '<div class="xmind">' +
      rootHtml +
      '<div class="branch-col root-branch">' + modulesHtml + '</div>' +
    '</div>' +
    '<div class="legend">' +
      '<div class="lg-item"><span class="lg-box" style="background:linear-gradient(135deg,#0052d9,#003cab)"></span>根节点（子任务+阶段）</div>' +
      '<div class="lg-item"><span class="lg-box" style="background:#fff;border:2px solid #0052d9"></span>测试模块</div>' +
      '<div class="lg-item"><span class="lg-box" style="background:#fff;border:1px solid #dde3ea"></span>测试案例</div>' +
      '<div class="lg-item"><span class="lg-box pri-high" style="border-radius:2px"></span>高</div>' +
      '<div class="lg-item"><span class="lg-box pri-mid" style="border-radius:2px"></span>中</div>' +
      '<div class="lg-item"><span class="lg-box pri-low" style="border-radius:2px"></span>低</div>' +
    '</div>';
}

/* ============ Tabs ============ */
function switchTab(tab){
  state.tab = tab;
  document.querySelectorAll(".tab-item").forEach(function(el){
    el.classList.toggle("active", el.getAttribute("data-tab") === tab);
  });
  document.getElementById("panelCase").classList.toggle("active", tab === "case");
  document.getElementById("panelMind").classList.toggle("active", tab === "mind");
  if(tab === "mind") renderMind();
}

/* ============ 事件绑定 ============ */
function bindEvents(){
  // 联动
  document.getElementById("selSubtask").addEventListener("change", function(e){
    state.subtask = e.target.value;
    // 同步写入全局
    if(window.TMSScope){
      var cur = SUBTASKS.find(function(s){ return s.id === state.subtask; });
      if(cur) TMSScope.setSubtaskName(cur.name);
    }
    renderStageOptions();
    state.casePage = 1;
    renderScopeMeta();
    renderCaseTable();
    if(state.tab === "mind") renderMind();
  });
  document.getElementById("selStage").addEventListener("change", function(e){
    state.stage = e.target.value;
    // 同步写入全局
    if(window.TMSScope){
      var sub = SUBTASKS.find(function(s){ return s.id === state.subtask; });
      var cur = sub && sub.stages.find(function(s){ return s.code === state.stage; });
      if(cur) TMSScope.setStageName(cur.name);
    }
    state.casePage = 1;
    renderScopeMeta();
    renderCaseTable();
    if(state.tab === "mind") renderMind();
  });

  // 订阅全局 scope 变化（由其他页面/标签页触发）
  if(window.TMSScope){
    TMSScope.onChange(function(ev){
      if(!ev || !ev.crossTab) return; // 仅处理跨页/跨标签页来源的变化
      if(ev.field === "subtask"){
        var m = TMSScope.pickMatch(SUBTASKS, function(s){ return s.name; }, ev.to);
        if(m && m.id !== state.subtask){
          state.subtask = m.id;
          document.getElementById("selSubtask").value = state.subtask;
          renderStageOptions();
          state.casePage = 1;
          renderScopeMeta();
          renderCaseTable();
          if(state.tab === "mind") renderMind();
        }
      }else if(ev.field === "stage"){
        var sub = SUBTASKS.find(function(s){ return s.id === state.subtask; });
        var mS = sub && TMSScope.pickMatch(sub.stages, function(s){ return s.name; }, ev.to);
        if(mS && mS.code !== state.stage){
          state.stage = mS.code;
          document.getElementById("selStage").value = state.stage;
          state.casePage = 1;
          renderScopeMeta();
          renderCaseTable();
          if(state.tab === "mind") renderMind();
        }
      }
    });
  }

  // Tabs
  document.querySelectorAll(".tab-item").forEach(function(el){
    el.addEventListener("click", function(){ switchTab(el.getAttribute("data-tab")); });
  });

  // 案例筛选
  var kw = document.getElementById("caseKw");
  var t = null;
  kw.addEventListener("input", function(){
    clearTimeout(t);
    t = setTimeout(function(){
      state.caseKw = kw.value; state.casePage = 1; renderCaseTable();
    }, 200);
  });
  ["fPriority","fType","fCaseStatus"].forEach(function(id){
    document.getElementById(id).addEventListener("change", function(e){
      if(id === "fPriority") state.casePriority = e.target.value;
      if(id === "fType") state.caseType = e.target.value;
      if(id === "fCaseStatus") state.caseStatus = e.target.value;
      state.casePage = 1; renderCaseTable();
    });
  });
  document.getElementById("caseReset").addEventListener("click", function(){
    document.getElementById("caseKw").value = "";
    document.getElementById("fPriority").value = "";
    document.getElementById("fType").value = "";
    document.getElementById("fCaseStatus").value = "";
    state.caseKw=""; state.casePriority=""; state.caseType=""; state.caseStatus="";
    state.casePage = 1; renderCaseTable();
  });

  // 全选
  document.getElementById("chkAll").addEventListener("change", function(e){
    document.querySelectorAll(".row-check").forEach(function(c){ c.checked = e.target.checked; });
  });

  // 大纲展开/折叠：切换每个模块下的案例行显示
  document.getElementById("mindExpand").addEventListener("click", function(){
    document.querySelectorAll("#mindCanvas .subtree > .branch-col").forEach(function(bc){
      bc.style.display = "flex";
    });
    document.querySelectorAll("#mindCanvas .subtree > .hline").forEach(function(h){
      h.style.display = "block";
    });
  });
  document.getElementById("mindCollapse").addEventListener("click", function(){
    document.querySelectorAll("#mindCanvas .subtree > .branch-col").forEach(function(bc){
      bc.style.display = "none";
    });
    document.querySelectorAll("#mindCanvas .subtree > .hline").forEach(function(h){
      h.style.display = "none";
    });
  });
}

/* ============ 初始化 ============ */
/* 挂载全局切换器 */
TMSGlobal.mount("#taskSwitcher", { showToast: true });

/* 当前任务变化时：重置子任务数据并重渲染 */
TMSGlobal.onChange(function(){
  SUBTASKS = resolveSubtasks(TMSGlobal.getCurrentId());
  state.subtask = SUBTASKS[0] ? SUBTASKS[0].id : "";
  state.stage   = SUBTASKS[0] && SUBTASKS[0].stages[0] ? SUBTASKS[0].stages[0].code : "";
  state.casePage = 1;
  initSubtaskOptions();
  renderStageOptions();
  renderScopeMeta();
  renderCaseTable();
  if(state.tab === "mind") renderMind();
});

/* 首次渲染 */
state.subtask = SUBTASKS[0] ? SUBTASKS[0].id : "";
state.stage   = SUBTASKS[0] && SUBTASKS[0].stages[0] ? SUBTASKS[0].stages[0].code : "";
initSubtaskOptions();
renderStageOptions();
bindEvents();
renderScopeMeta();
renderCaseTable();
</script>
