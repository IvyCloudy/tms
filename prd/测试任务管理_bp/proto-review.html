/* ========== 页面特有样式 ========== */
table{min-width:1420px}
.scope-meta strong{color:#e34d59;font-weight:600;margin:0 3px}

.rv-code{color:#0052d9;cursor:pointer;font-family:"SF Mono","Menlo",monospace;font-size:11.5px;font-weight:600}
.rv-code:hover{text-decoration:underline}
.rv-title{font-weight:500;color:#1a1a1a;display:inline-block;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.rv-title:hover{color:#0052d9;cursor:pointer}
.rv-meta{font-size:10.5px;color:#999;margin-top:2px}
.rv-meta .dot{margin:0 5px;color:#ddd}

/* 评审类型 */
.rv-type{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;font-size:10.5px;border-radius:2px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.rt-plan{background:#e8f3ff;color:#0052d9;border-color:#bdd7ff}
.rt-design{background:#f3e8ff;color:#7b3fe4;border-color:#dcc8ff}
.rt-summary{background:#e8f8f0;color:#2ba471;border-color:#bfe7cf}

/* 评审方式 */
.rv-way{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;font-size:10.5px;border-radius:2px;font-weight:500;white-space:nowrap}
.rv-way::before{content:"";width:6px;height:6px;border-radius:50%;display:inline-block}
.rw-email{background:#fff3e0;color:#e37318}.rw-email::before{background:#e37318}
.rw-meeting{background:#e8f3ff;color:#0052d9}.rw-meeting::before{background:#0052d9}

/* 评审状态 */
.rv-status{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;font-size:10.5px;border-radius:2px;font-weight:500;white-space:nowrap}
.rv-status::before{content:"";width:6px;height:6px;border-radius:50%;display:inline-block}
.rs-pending{background:#f0f2f5;color:#666}.rs-pending::before{background:#888}
.rs-reviewing{background:#fff3e0;color:#e37318}.rs-reviewing::before{background:#e37318;animation:pulse 1.4s infinite}
.rs-passed{background:#e8f8f0;color:#2ba471}.rs-passed::before{background:#2ba471}
.rs-failed{background:#fde2e3;color:#e34d59}.rs-failed::before{background:#e34d59}
.rs-canceled{background:#f0f2f5;color:#999}.rs-canceled::before{background:#bbb}

/* 结果/通过率 */
.result-pass{display:inline-block;padding:1px 7px;font-size:10.5px;border-radius:2px;background:#e8f8f0;color:#2ba471;font-weight:500}
.result-fail{display:inline-block;padding:1px 7px;font-size:10.5px;border-radius:2px;background:#fde2e3;color:#e34d59;font-weight:500}
.result-none{color:#bbb;font-size:11px}
.pass-bar{display:inline-flex;align-items:center;gap:6px}
.pass-bar .bar{width:60px;height:6px;background:#f0f2f5;border-radius:3px;overflow:hidden}
.pass-bar .bar i{display:block;height:100%;background:#2ba471}
.pass-bar .bar.warn i{background:#e37318}
.pass-bar .bar.bad  i{background:#e34d59}
.pass-bar .pct{font-size:11px;color:#666;min-width:34px;text-align:right}

.avatars-group{display:inline-flex;align-items:center}
.avatars-group .avatar-mini{margin-right:-6px;border:2px solid #fff}
.avatars-group .more{margin-left:10px;font-size:11px;color:#888}

/* ============ 工具 ============ */
function escapeHtml(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];
  });
}
function highlight(text, kw){
  if(!kw) return escapeHtml(text);
  var esc = escapeHtml(text);
  var re = new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "ig");
  return esc.replace(re, function(m){ return "<mark>" + m + "</mark>"; });
}
function showToast(msg){
  var el = document.getElementById("toast");
  el.innerText = msg;
  el.classList.add("show");

/* ============ 按范围 ============ */
function reviewsInScope(){
  return REVIEWS.filter(function(r){
    if(state.subtask && r.subtask !== state.subtask) return false;
    if(state.scope === "mine" && r.ownerObj.name !== ME) return false;
    if(state.scope === "join"){
      var hit = r.memberObjs.some(function(m){ return m.name === ME; });
      if(!hit) return false;
    }
    if(state.scope === "todo"){
      var hit2 = r.memberObjs.some(function(m){ return m.name === ME; });
      if(!hit2 || (r.status !== "pending" && r.status !== "reviewing")) return false;
    }
    return true;
  });
}

  var reviewing = list.filter(function(r){return r.status==="reviewing";}).length;

  var canceled  = list.filter(function(r){return r.status==="canceled";}).length;

  document.getElementById("ovPending").innerText   = pending;
  document.getElementById("ovReviewing").innerText = reviewing;
  document.getElementById("ovPassed").innerText    = passed;
  document.getElementById("ovFailed").innerText    = failed;
  document.getElementById("ovCanceled").innerText  = canceled;

  var finished = passed + failed;
  var passPct  = finished ? Math.round(passed / finished * 100) : 0;
  var passedPctEl = document.getElementById("ovPassedPct");
  if(passedPctEl) passedPctEl.innerText = passPct + "% 通过率";

  var mc = document.getElementById("metaScopeCount");
  if(mc) mc.innerText = total;
}

/* ============ 过滤 ============ */
function getFilteredList(){
  var kw = state.kw.trim().toLowerCase();
  return reviewsInScope().filter(function(r){
    if(state.type    && r.type   !== state.type)   return false;
    if(state.way     && r.way    !== state.way)    return false;
    if(state.statusIn && state.statusIn.length){
      if(state.statusIn.indexOf(r.status) < 0) return false;
    } else if(state.status && r.status !== state.status){
      return false;
    }
    if(state.ownerName && r.ownerObj.name !== state.ownerName) return false;
    if(kw){
      var memberTxt = r.memberObjs.map(function(m){return m.name;}).join(",");
      var hay = (r.id + " " + r.title + " " + r.ownerObj.name + " " + memberTxt).toLowerCase();
      if(hay.indexOf(kw) < 0) return false;
    }
    return true;
  });
}

/* ============ 表格 ============ */
function subtaskName(id){
  var s = SUBTASKS.find(function(x){ return x.id === id; });
  return s ? s.name : id;
}

function passBar(r){
  if(r.status === "pending" || r.status === "canceled"){
    return '<span class="result-none">—</span>';
  }
  var pct = r.total ? Math.round(r.pass / r.total * 100) : 0;
  var cls = pct >= 80 ? "" : pct >= 50 ? "warn" : "bad";
  return '<div class="pass-bar">' +
           '<div class="bar ' + cls + '"><i style="width:' + pct + '%"></i></div>' +
           '<span class="pct">' + r.pass + '/' + r.total + '</span>' +
         '</div>';
}

function renderMembers(list){
  var show = list.slice(0, 3);
  var rest = list.length - show.length;
  var html = '<div class="avatars-group">' +
    show.map(function(m){
      return '<span class="avatar-mini ' + m.cls + '" title="' + escapeHtml(m.name) + '">' + m.short + '</span>';
    }).join("");
  if(rest > 0) html += '<span class="more">+' + rest + '</span>';
  html += '</div>';
  return html;
}

function renderTable(){
  var list = getFilteredList();
  document.getElementById("listCount").innerText = list.length;

  var tbody = document.getElementById("tbody");
  if(list.length === 0){
    tbody.innerHTML = '<tr><td colspan="11">' +
      '<div class="empty-state"><div class="empty-icon">◌</div>' +
      '<div class="empty-text">没有匹配的评审</div></div></td></tr>';
    document.getElementById("pager").innerHTML = "";
    return;
  }

  var totalPages = Math.max(1, Math.ceil(list.length / state.pageSize));
  if(state.page > totalPages) state.page = totalPages;
  var start = (state.page - 1) * state.pageSize;
  var pageList = list.slice(start, start + state.pageSize);

  var kw = state.kw.trim();
  tbody.innerHTML = pageList.map(function(r){
    var tp = TYPE_META[r.type]   || TYPE_META.plan;
    var wy = WAY_META[r.way]     || WAY_META.email;
    var st = STATUS_META[r.status] || STATUS_META.pending;

    return '<tr>' +
      '<td><span class="rv-code">' + highlight(r.id, kw) + '</span></td>' +
      '<td>' +
        '<div><span class="rv-title" title="' + escapeHtml(r.title) + '">' +
          highlight(r.title, kw) + '</span></div>' +
        (r.comment ? '<div class="rv-meta">评语：' + escapeHtml(r.comment) + '</div>' : '') +
      '</td>' +
      '<td><span class="rv-type ' + tp.cls + '">' + tp.text + '</span></td>' +
      '<td><span class="rv-way ' + wy.cls + '">' + wy.text + '</span></td>' +
      '<td>' + escapeHtml(subtaskName(r.subtask)) + '</td>' +
      '<td><div class="owner-cell">' +
        '<span class="avatar-mini ' + r.ownerObj.cls + '">' + r.ownerObj.short + '</span>' +
        highlight(r.ownerObj.name, kw) +
      '</div></td>' +
      '<td>' + renderMembers(r.memberObjs) + '</td>' +
      '<td style="color:#666">' + escapeHtml(r.time) + '</td>' +
      '<td><span class="rv-status ' + st.cls + '">' + st.text + '</span></td>' +
      '<td>' + passBar(r) + '</td>' +
      '<td>' +
        '<span class="op-link" data-act="detail" data-id="' + r.id + '">查看</span>' +
        '<span class="op-link" data-act="result" data-id="' + r.id + '">结论</span>' +
        '<span class="op-link" data-act="export" data-id="' + r.id + '">导出</span>' +
      '</td>' +
    '</tr>';
  }).join("");

  renderPagination(list.length, totalPages);
}

function renderPagination(total, totalPages){
  var pager = document.getElementById("pager");
  var html = '<span class="pg-total">共 ' + total + ' 条</span>';
  html += '<button class="page-btn" data-go="prev"' + (state.page<=1?" disabled":"") + '>‹</button>';
  var s = Math.max(1, state.page - 2);
  var e = Math.min(totalPages, s + 4);
  s = Math.max(1, e - 4);
  for(var i=s; i<=e; i++){
    html += '<button class="page-btn' + (i===state.page?' active':'') + '" data-go="' + i + '">' + i + '</button>';
  }
  html += '<button class="page-btn" data-go="next"' + (state.page>=totalPages?" disabled":"") + '>›</button>';
  html += '<select class="page-size" id="pgSize">' +
            '<option value="10"' + (state.pageSize===10?" selected":"") + '>10 条/页</option>' +
            '<option value="20"' + (state.pageSize===20?" selected":"") + '>20 条/页</option>' +
            '<option value="50"' + (state.pageSize===50?" selected":"") + '>50 条/页</option>' +
          '</select>';
  pager.innerHTML = html;
}

/* ============ 发起人下拉 ============ */
function initOwnerOptions(){
  var sel = document.getElementById("fOwner");
  var names = {};
  REVIEWS.forEach(function(r){ names[r.ownerObj.name] = true; });
  sel.innerHTML = '<option value="">全部发起人</option>' +
    Object.keys(names).map(function(n){
      return '<option value="' + escapeHtml(n) + '">' + escapeHtml(n) + '</option>';
    }).join("");
}

/* ============ 子任务下拉 ============ */
function initSubtaskOptions(){
  var sel = document.getElementById("selSubtask");
  sel.innerHTML = '<option value="">全部子任务</option>' +
    SUBTASKS.map(function(s){
      return '<option value="' + s.id + '">' + escapeHtml(s.name) + '</option>';
    }).join("");
  // 先尝试按全局 scope 中保存的子任务名匹配
  if(window.TMSScope){
    var m = TMSScope.pickMatch(SUBTASKS, function(s){ return s.name; }, TMSScope.getSubtaskName());
    if(m) state.subtask = m.id;
    // 注：评审页面本身支持“全部子任务”，若全局无值则保留当前 state.subtask，不强制重置
  }
  sel.value = state.subtask;
  // 只有在选中具体子任务时才回写，避免“全部子任务”覆盖其他页面的选择
  if(window.TMSScope && state.subtask){
    var cur = SUBTASKS.find(function(s){ return s.id === state.subtask; });
    if(cur) TMSScope.setSubtaskName(cur.name);
  }
}

/* ============ 事件 ============ */
function bindEvents(){
  var kw = document.getElementById("rvKw");
  var t = null;
  kw.addEventListener("input", function(){
    clearTimeout(t);
    t = setTimeout(function(){
      state.kw = kw.value;
      state.page = 1;
      renderTable();
    }, 200);
  });

  [
    ["fType",   "type"],
    ["fWay",    "way"],
    ["fStatus", "status"],
    ["fOwner",  "ownerName"]
  ].forEach(function(p){
    document.getElementById(p[0]).addEventListener("change", function(e){
      state[p[1]] = e.target.value;
      if(p[1] === "status"){
        state.statusIn = e.target.value ? [e.target.value] : [];
        if(typeof syncStatCards === "function") syncStatCards();
      }
      state.page = 1;
      renderTable();
    });
  });

  // 联动：子任务 / 评审范围
  document.getElementById("selSubtask").addEventListener("change", function(e){
    state.subtask = e.target.value;
    if(window.TMSScope && state.subtask){
      var cur = SUBTASKS.find(function(s){ return s.id === state.subtask; });
      if(cur) TMSScope.setSubtaskName(cur.name);
    }
    state.page = 1;
    renderOverview();
    renderTable();
  });
  document.getElementById("selScope").addEventListener("change", function(e){
    state.scope = e.target.value;
    state.page = 1;
    renderOverview();
    renderTable();
  });

  // 订阅全局 scope 变化（由其他页面/标签页触发）
  if(window.TMSScope){
    TMSScope.onChange(function(ev){
      if(!ev || !ev.crossTab) return;
      if(ev.field === "subtask"){
        var m = TMSScope.pickMatch(SUBTASKS, function(s){ return s.name; }, ev.to);
        var newVal = m ? m.id : "";
        if(newVal !== state.subtask){
          state.subtask = newVal;
          document.getElementById("selSubtask").value = state.subtask;
          state.page = 1;
          renderOverview();
          renderTable();
        }
      }
    });
  }

  document.getElementById("btnReset").addEventListener("click", function(){
    state.kw = ""; state.type = ""; state.way = "";
    state.status = ""; state.statusIn = []; state.ownerName = ""; state.scope = ""; state.page = 1;
    document.getElementById("rvKw").value = "";
    ["selScope","fType","fWay","fStatus","fOwner"].forEach(function(id){
      document.getElementById(id).value = "";
    });
    if(typeof syncStatCards === "function") syncStatCards();
    renderTable();
    showToast("已重置筛选条件");
  });

  // 统计卡片点击筛选
  function syncStatCards(){
    var cur = (state.statusIn || []).slice().sort().join(",");
    document.querySelectorAll(".stat-mini[data-stat]").forEach(function(c){
      var s = c.getAttribute("data-stat");
      var arr = (s === "all") ? [] : s.split(",").map(function(x){return x.trim();}).filter(Boolean);
      var key = arr.slice().sort().join(",");
      if(key === cur){ c.classList.add("active"); }
      else { c.classList.remove("active"); }
    });
  }
  document.querySelectorAll(".stat-mini[data-stat]").forEach(function(card){
    card.addEventListener("click", function(){
      var s = card.getAttribute("data-stat");
      var arr = (s === "all") ? [] : s.split(",").map(function(x){return x.trim();}).filter(Boolean);
      var curKey = (state.statusIn || []).slice().sort().join(",");
      var newKey = arr.slice().sort().join(",");
      if(curKey === newKey){
        state.statusIn = []; state.status = "";
      } else {
        state.statusIn = arr;
        state.status = arr.length === 1 ? arr[0] : "";
      }
      var fSel = document.getElementById("fStatus");
      if(fSel) fSel.value = (state.statusIn.length === 1) ? state.statusIn[0] : "";
      state.page = 1;
      syncStatCards();
      renderTable();
    });
  });
  syncStatCards();

  var btnAdd = document.getElementById("btnAddReview");
  if(btnAdd){
    btnAdd.addEventListener("click", function(){
      showToast("打开新增评审表单");
    });
  }

  // 分页
  document.getElementById("pager").addEventListener("click", function(e){
    var b = e.target.closest(".page-btn");
    if(!b || b.disabled) return;
    var go = b.getAttribute("data-go");
    var totalPages = Math.max(1, Math.ceil(getFilteredList().length / state.pageSize));
    if(go === "prev") state.page = Math.max(1, state.page - 1);
    else if(go === "next") state.page = Math.min(totalPages, state.page + 1);
    else state.page = parseInt(go, 10);
    renderTable();
  });
  document.getElementById("pager").addEventListener("change", function(e){
    if(e.target && e.target.id === "pgSize"){
      state.pageSize = parseInt(e.target.value, 10);
      state.page = 1;
      renderTable();
    }
  });

  // 表格操作
  document.getElementById("tbody").addEventListener("click", function(e){
    var el = e.target.closest(".op-link, .rv-code, .rv-title");
    if(!el) return;
    var id = el.getAttribute("data-id") || el.innerText;
    if(el.classList.contains("op-link")){
      var act = el.getAttribute("data-act");
      if(act === "detail")      showToast("打开评审详情：" + id);
      else if(act === "result") showToast("填写评审结论：" + id);
      else if(act === "export") showToast("导出评审记录：" + id);
    } else {
      showToast("打开评审详情：" + id);
    }
  });
}

/* ============ 初始化 ============ */
document.addEventListener("DOMContentLoaded", function(){
  // 顶部任务切换（全局）
  if(window.TMSGlobal){
    if(typeof TMSGlobal.mount === "function"){
      TMSGlobal.mount("#taskSwitcher", { showToast: true });
    } else if(typeof TMSGlobal.mountSwitcher === "function"){
      TMSGlobal.mountSwitcher(document.getElementById("taskSwitcher"));
    }
    TMSGlobal.onChange(function(){
      SUBTASKS = resolveSubtasks(TMSGlobal.getCurrentId());
      state.subtask = "";
      state.page = 1;
      initSubtaskOptions();
      renderOverview();
      renderTable();
      showToast("任务已切换，评审列表已刷新");
    });
  } else {
    var cur = document.querySelector(".task-switcher .ts-current");
    if(cur) cur.innerText = "T001 · 支付业务 2026Q2 迭代测试";
  }

  initSubtaskOptions();
  initOwnerOptions();
  renderOverview();
  renderTable();
  bindEvents();
});
</script>
