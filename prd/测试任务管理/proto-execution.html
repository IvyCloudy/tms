<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>TMS 测试任务管理 — 执行管理</title>
<link rel="stylesheet" href="tms-common.css">
<style>
/* ========== 页面特有样式 ========== */
table{min-width:1280px}
.top-filters .scope-select{min-width:180px}
.top-filters .scope-select.round-sel{min-width:160px}
.scope-select.round-sel{min-width:180px}
.scope-meta strong{color:#0052d9}
.scope-meta .round-tag{display:inline-block;padding:1px 7px;background:#fff3e0;color:#e37318;font-size:10.5px;border-radius:2px;margin-left:6px;font-weight:500}
.scope-meta .round-tag.tag-done{background:#e8f8f0;color:#2ba471}
.scope-meta .round-tag.tag-active{background:#e8f3ff;color:#0052d9}
.case-toolbar .case-search{max-width:300px}

/* 进度条 */
.progress-wrap{background:#fff;border:1px solid #e5e9ef;border-radius:6px;padding:14px 18px;margin-bottom:14px}
.progress-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.progress-head .pw-title{font-size:13px;font-weight:600;color:#333}
.progress-head .pw-pct{font-size:13px;font-weight:600;color:#0052d9}
.progress-bar{height:12px;border-radius:6px;background:#f0f2f5;display:flex;overflow:hidden}
.pb-seg{height:100%;transition:width .4s}
.pb-passed{background:#2ba471}
.pb-failed{background:#e34d59}
.pb-blocked{background:#e37318}
.pb-skipped{background:#c5cbd3}
.progress-legend{display:flex;gap:16px;margin-top:10px;font-size:11.5px;color:#666;flex-wrap:wrap}
.progress-legend .lg-item{display:flex;align-items:center;gap:5px}
.progress-legend .lg-dot{width:10px;height:10px;border-radius:2px}

.case-code{color:#0052d9;cursor:pointer;font-family:"SF Mono","Menlo",monospace;font-size:11.5px;font-weight:500}
.case-code:hover{text-decoration:underline}
.case-name{font-weight:500;color:#1a1a1a}
.case-name:hover{color:#0052d9;cursor:pointer}
.case-path{font-size:10.5px;color:#999;margin-top:2px}

/* 执行状态 */
.exec-status{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;font-size:10.5px;border-radius:2px;font-weight:500;white-space:nowrap}
.exec-status::before{content:"";width:6px;height:6px;border-radius:50%;display:inline-block}
.es-pending{background:#f0f2f5;color:#888}
.es-pending::before{background:#aaa}
.es-running{background:#e8f3ff;color:#0052d9}
.es-running::before{background:#0052d9;animation:pulse 1.4s infinite}
.es-passed{background:#e8f8f0;color:#2ba471}
.es-passed::before{background:#2ba471}
.es-failed{background:#fde2e3;color:#e34d59}
.es-failed::before{background:#e34d59}
.es-blocked{background:#fff3e0;color:#e37318}
.es-blocked::before{background:#e37318}
.es-skipped{background:#f3e8ff;color:#7b3fe4}
.es-skipped::before{background:#7b3fe4}

/* 执行方式 */
.exec-type{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;font-size:10.5px;border-radius:2px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.exec-type .et-ic{font-size:11px;line-height:1}
.et-manual{background:#f0f2f5;color:#555;border-color:#e5e9ef}
.et-auto{background:#e8f3ff;color:#0052d9;border-color:#bdd7ff}
.et-ui{background:#f3e8ff;color:#7b3fe4;border-color:#dcc8ff}

.bug-link{display:inline-block;padding:1px 6px;background:#fde2e3;color:#e34d59;font-size:10.5px;border-radius:2px;margin-right:4px;cursor:pointer;font-family:"SF Mono","Menlo",monospace}
.bug-link:hover{background:#e34d59;color:#fff}
.no-bug{color:#bbb;font-size:11.5px}

.op-link.exec{color:#2ba471;font-weight:500}

/* 轮次芯片（可选） */
.round-chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:-6px}
.round-chip{padding:4px 10px;font-size:11.5px;border-radius:14px;border:1px solid #dde3ea;color:#666;cursor:pointer;background:#fff;display:inline-flex;align-items:center;gap:5px}
.round-chip:hover{border-color:#0052d9;color:#0052d9}
.round-chip.active{background:#0052d9;color:#fff;border-color:#0052d9}
.round-chip.active .chip-status{background:rgba(255,255,255,.25);color:#fff}
.chip-status{display:inline-block;padding:0 5px;font-size:10px;border-radius:6px;background:#f0f2f5;color:#888}
.chip-status.status-done{background:#e8f8f0;color:#2ba471}
.chip-status.status-active{background:#e8f3ff;color:#0052d9}
</style>
<link rel="stylesheet" href="tms-scope-dropdown.css">
</head>

</div>

<div class="layout">
  <div class="side-menu">
    <a href="proto-workbench.html" class="menu-item"><span class="menu-icon">◈</span>工作台</a>
    <a href="proto-task-list.html" class="menu-item"><span class="menu-icon">◎</span>测试任务</a>
    <a href="proto-task-detail.html" class="menu-item"><span class="menu-icon">▤</span>任务详情</a>
    <a href="proto-design.html" class="menu-item"><span class="menu-icon">◇</span>设计管理</a>
<a href="#" class="menu-item active"><span class="menu-icon">▷</span>执行管理</a>
<a href="proto-defect.html" class="menu-item"><span class="menu-icon">◆</span>缺陷管理</a>

  <div class="main-content">

    <div class="page-header">
      <div></div>
      <div class="page-actions">

    <!-- 执行概览 -->
    <div class="stat-bar">

        <div class="sm-value" id="ovTotal">0<span class="sm-sub">个</span></div>
      </div>
      <div class="stat-mini" data-stat="passed">

      <div class="stat-mini" data-stat="failed">

      <div class="stat-mini" data-stat="blocked">
        <div class="sm-label">阻塞</div>
        <div class="sm-value" id="ovBlocked" style="color:#e37318">0</div>

    <!-- 执行进度 -->
    <div class="progress-wrap">
      <div class="progress-head">

      <div class="progress-bar" id="progressBar"></div>
      <div class="progress-legend">
        <div class="lg-item"><span class="lg-dot pb-passed"></span>通过 <span id="lgPassed">0</span></div>

    <!-- 案例执行列表 -->

      <div class="case-toolbar">

<input id="caseKw" placeholder="搜索编号 / 名称 / 执行人" />
        </div>
        <select id="fStatus" class="filter-select">
          <option value="">全部执行状态</option>

          <option value="blocked">阻塞</option>

        <select id="fPriority" class="filter-select">

              <option value="中">中</option>

        <select id="fExecType" class="filter-select">

      <div class="table-scroll">

      <div id="caseEmpty" class="empty-state" style="display:none">

<div class="toast" id="toast"></div>

<script src="tms-api.js"></script>
<script>
/* ============ 基础数据（与设计管理对齐） ============ */
var FULL_STAGES = [
  { code:"smoke",      name:"冒烟测试" },
  { code:"st",         name:"系统测试（ST）" },
  { code:"regression", name:"回归测试" },
  { code:"uat",        name:"用户验收（UAT）" }
];
var STAGES_NO_REG = [FULL_STAGES[0], FULL_STAGES[1], FULL_STAGES[3]];
var STAGES_ST_REG = [FULL_STAGES[1], FULL_STAGES[2]];

var SUBTASKS_BY_TASK = {
  "T001": [
    { id:"sub-pay-api",  name:"支付核心 API 重构",        stages: FULL_STAGES },
    { id:"sub-cashier",  name:"收银台前端改版",           stages: STAGES_NO_REG },
    { id:"sub-risk",     name:"风控规则引擎接入",         stages: STAGES_ST_REG },
    { id:"sub-channel",  name:"第三方渠道对接（银联/支付宝）", stages: STAGES_NO_REG }
  ],
  "T002": [
    { id:"sub-coupon-core",  name:"优惠券核心逻辑",   stages: FULL_STAGES },
    { id:"sub-coupon-ui",    name:"优惠券领取页面 H5", stages: STAGES_NO_REG },
    { id:"sub-coupon-share", name:"优惠券分享与裂变",   stages: STAGES_NO_REG }
  ],
  "T003": [
    { id:"sub-search-recall", name:"搜索召回算法回归",   stages: STAGES_ST_REG },
    { id:"sub-search-rank",   name:"搜索排序算法回归",   stages: STAGES_ST_REG },
    { id:"sub-search-ui",     name:"搜索结果页面兼容",   stages: FULL_STAGES }
  ],
  "T004": [
    { id:"sub-fulfill-perf",   name:"履约引擎压测",       stages: [FULL_STAGES[1], FULL_STAGES[2]] },
    { id:"sub-fulfill-break",  name:"履约系统断路测试",   stages: [FULL_STAGES[1]] }
  ],
  "T005": [
    { id:"sub-i18n-gateway",  name:"国际化网关测试",    stages: FULL_STAGES },
    { id:"sub-i18n-template", name:"多语言模板渲染",    stages: STAGES_NO_REG }
  ],
  "T006": [
    { id:"sub-login-mfa",     name:"MFA 多因素认证流程",  stages: STAGES_NO_REG },
    { id:"sub-login-risk",    name:"登录风控拦截",        stages: STAGES_ST_REG }
  ]
};
var DEFAULT_SUBTASKS = [
  { id:"sub-default", name:"默认测试子任务", stages: FULL_STAGES }
];
function resolveSubtasks(taskId){
  return SUBTASKS_BY_TASK[taskId] || DEFAULT_SUBTASKS;
}
var SUBTASKS = resolveSubtasks(
  (window.TMSGlobal ? TMSGlobal.getCurrentId() : "T001")
);

/* ============ 测试轮次数据 ============ */
/*
 * 轮次与 "子任务 + 测试阶段" 真正联动：
 *   - 不同阶段默认轮次数不同（冒烟=1；ST=3；回归=1；UAT=2）
 *   - 不同子任务的节奏不同（通过 subOffset 平移起止时间 + 负责人）
 *   - 如果 subtask/stage 不存在或为空，返回空数组（下拉框会被禁用）
 */
var ROUND_PLAN_BY_STAGE = {
  smoke: [
    { no:1, name:"第 1 轮（冒烟）", status:"active", statusText:"进行中", offset:0,  duration:2 }
  ],
  st: [
    { no:1, name:"第 1 轮",         status:"done",    statusText:"已完成", offset:0,  duration:4 },
    { no:1, name:"第 2 轮",         status:"active",  statusText:"进行中", offset:10, duration:10 },
    { no:1, name:"第 3 轮（回归）", status:"pending", statusText:"未开始", offset:28, duration:4 }
  ],
  regression: [
    { no:1, name:"第 1 轮（回归）", status:"pending", statusText:"未开始", offset:32, duration:3 }
  ],
  uat: [
    { no:1, name:"第 1 轮（UAT）", status:"pending", statusText:"未开始", offset:36, duration:4 },
    { no:2, name:"第 2 轮（UAT 验收）", status:"pending", statusText:"未开始", offset:42, duration:2 }
  ]
};
/* 不同子任务的节奏错开，owner 不同 */
var SUB_ROUND_META = {
  "sub-pay-api":   { offset:0,  owner:"张小明" },
  "sub-cashier":   { offset:2,  owner:"王测试" },
  "sub-risk":      { offset:4,  owner:"赵架构师" },
  "sub-channel":   { offset:6,  owner:"李工程师" },
  "sub-uat":       { offset:10, owner:"孙小红" }
};
function addDays(baseStr, days){
  var d = new Date(baseStr);
  d.setDate(d.getDate() + days);
  var y = d.getFullYear();
  var m = String(d.getMonth()+1).padStart(2,"0");
  var dd = String(d.getDate()).padStart(2,"0");
  return y + "-" + m + "-" + dd;
}
function genRounds(subId, stageCode){
  if(!subId || !stageCode) return [];
  var plan = ROUND_PLAN_BY_STAGE[stageCode];
  if(!plan || plan.length === 0) return [];
  var subMeta = SUB_ROUND_META[subId] || { offset:0, owner:"张小明" };
  var BASE = "2026-04-08";
  return plan.map(function(p, idx){
    var start = addDays(BASE, p.offset + subMeta.offset);
    var end   = addDays(start, p.duration);
    return {
      id: subId + "-" + stageCode + "-R" + (idx + 1),
      no: idx + 1,
      name: p.name,
      status: p.status,
      statusText: p.statusText,
      startDate: start,
      endDate: end,
      owner: subMeta.owner
    };
  });
}

/* ============ 案例池（与设计管理对齐） ============ */
function mkCase(i, name, type, priority, ownerIdx, scope){
  return {
    id: "CASE-" + (2600 + i),
    name: name,
    path: scope.subName + " / " + scope.stageName,
    type: type, priority: priority,
    execType: inferExecType(name),
    ownerIdx: ownerIdx,
    subtask: scope.subId, stage: scope.stageCode
  };
}
var OWNERS = [
  {name:"张小明", short:"张", color:"#0052d9"},
  {name:"李工程师", short:"李", color:"#2ba471"},
  {name:"王测试", short:"王", color:"#7b3fe4"},
  {name:"赵架构师", short:"赵", color:"#e37318"},
  {name:"孙小红", short:"孙", color:"#d64b8a"}
];

var CASE_POOL = [];
(function(){
  var tpl = {
    "sub-pay-api": {
      smoke: ["创建支付订单-主流程可用","查询订单状态-返回正常","支付回调通知-签名校验"],
      st: [
        "支付订单创建-正常金额","支付订单创建-金额为0","支付订单创建-超过上限金额",
        "支付订单创建-并发幂等","支付渠道路由-默认通道","支付渠道路由-主通道异常降级",
        "退款申请-全额退款","退款申请-部分退款","退款申请-超额拒绝",
        "查询订单-按订单号","查询订单-按商户单号","订单状态机-状态流转校验",
        "支付回调-重复通知幂等","支付回调-签名篡改拒绝"
      ],
      regression: ["历史订单查询兼容","旧版回调协议兼容","MySQL 分库分表路由回归"],
      uat: ["业务方对账单生成","业务方对账差异确认","UAT 环境全链路支付"]
    },
    "sub-cashier": {
      smoke: ["收银台首屏渲染","支付方式切换"],
      st: [
        "收银台-金额展示正确","收银台-优惠券选择","收银台-优惠券互斥校验",
        "收银台-支付方式排序","收银台-超时倒计时","收银台-重复提交拦截",
        "收银台-移动端适配","收银台-网络异常重试"
      ],
      uat: ["业务方收银台走查","视觉还原度验收"]
    },
    "sub-risk": {
      st: [
        "风控规则命中-黑名单拦截","风控规则命中-高风险二次验证",
        "风控规则命中-白名单放行","风控规则-规则优先级","风控规则-异步决策超时兜底"
      ],
      regression: ["历史风控规则兼容","决策日志回归"]
    },
    "sub-channel": {
      smoke: ["银联通道连通性","支付宝通道连通性"],
      st: [
        "银联-代扣签约","银联-代扣支付","银联-代扣解约",
        "支付宝-扫码支付","支付宝-退款","支付宝-异步通知"
      ],
      uat: ["渠道方联调-银联","渠道方联调-支付宝"]
    }
  };
  var i = 0;
  SUBTASKS.forEach(function(sub){
    sub.stages.forEach(function(st){
      var names = (tpl[sub.id] && tpl[sub.id][st.code]) || [];
      names.forEach(function(nm){
        i++;
        var type = /性能|并发|超时/.test(nm) ? "性能"
                 : /签名|拦截|白名单|黑名单|风控/.test(nm) ? "安全"
                 : /接口|API|回调|通知/.test(nm) ? "接口"
                 : /移动端|适配|兼容/.test(nm) ? "兼容"
                 : "功能";
        var pri = /主流程|签约|回调|首屏|创建|退款|风控|超时|异常|并发/.test(nm) ? "高"
                : /查询|切换|排序/.test(nm) ? "中" : "低";
        CASE_POOL.push(mkCase(i, nm, type, pri, i % OWNERS.length, {
          subId: sub.id, subName: sub.name, stageCode: st.code, stageName: st.name
        }));
      });
    });
  });
})();

/* ============ 为每一轮次生成执行记录 ============ */
/* 规则：
   - round.status=done   → 案例 90% passed, 10% failed
   - round.status=active → ~45% passed, ~15% failed, ~5% blocked, ~5% skipped, 其余 pending/running
   - round.status=pending→ 全部 pending
*/
var EXECUTIONS = {}; // key = roundId, value = [records...]
function seed(s){ var x = Math.sin(s) * 10000; return x - Math.floor(x); }
function buildExecutionsForRound(round, cases){
  var records = cases.map(function(c, idx){
    var r = seed(hashCode(round.id) + idx * 31);
    var status = "pending";
    if(round.status === "done"){
      status = r < 0.9 ? "passed" : "failed";
    }else if(round.status === "active"){
      if(r < 0.45) status = "passed";
      else if(r < 0.60) status = "failed";
      else if(r < 0.65) status = "blocked";
      else if(r < 0.70) status = "skipped";
      else if(r < 0.85) status = "running";
      else status = "pending";
    }
    var owner = OWNERS[c.ownerIdx];
    var hasBug = (status === "failed") || (status === "blocked" && r < 0.67);
    var duration = (status === "pending") ? "-" :
                   (status === "running") ? ((2 + Math.floor(r*8)) + "分钟") :
                   ((5 + Math.floor(r*55)) + "分钟");
    var execTime = "-";
    if(status !== "pending"){
      var day = Math.floor(r * 10) + (round.status === "done" ? 8 : 18);
      var hour = 9 + Math.floor(r*9);
      var min = Math.floor(r*60);
      execTime = "2026-04-" + (day < 10 ? "0"+day : day) + " " +
                 (hour < 10 ? "0"+hour : hour) + ":" + (min < 10 ? "0"+min : min);
    }
    var bugs = [];
    if(hasBug){
      bugs.push("BUG-" + (8500 + Math.floor(r*999)));
      if(r > 0.7) bugs.push("BUG-" + (8500 + Math.floor((r+0.1)*999)));
    }
    return {
      caseId: c.id, name: c.name, path: c.path, priority: c.priority,
      execType: c.execType || inferExecType(c.name),
      status: status, owner: owner, execTime: execTime, duration: duration,
      bugs: bugs, subtask: c.subtask, stage: c.stage
    };
  });
  return records;
}
function hashCode(s){
  var h = 0;
  for(var i = 0; i < s.length; i++){
    h = ((h << 5) - h) + s.charCodeAt(i);
    h |= 0;
  }
  return Math.abs(h);
}

/* ============ 状态 ============ */
var state = {
  subtask: "",
  stage: "",
  roundId: "",
  rounds: [],              // 当前 subtask+stage 的轮次列表
  execList: [],            // 当前轮次的所有执行记录
  // 过滤
  kw:"", status:"", statusIn:[], priority:"", execType:"", owner:"", hasBug:"",
  page:1, pageSize:10
};

/* ============ 工具 ============ */
function escapeHtml(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function priCls(p){
  return p === "高" ? "pri-high" : p === "中" ? "pri-mid" : "pri-low";
}
function highlight(text, kw){
  var safe = escapeHtml(text);
  if(!kw) return safe;
  var k = kw.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return safe.replace(new RegExp(k, "gi"), function(m){ return "<mark>" + m + "</mark>"; });
}
function showToast(msg){
  var el = document.getElementById("toast");
  el.innerText = msg;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.remove("show"); }, 1800);
}
var EXEC_TYPE_META = {
  manual: { text:"手工",   icon:"✋", cls:"et-manual" },
  auto:   { text:"自动化", icon:"⚙",  cls:"et-auto" },
  ui:     { text:"界面",   icon:"🖥", cls:"et-ui" }
};
function renderExecType(t){
  var m = EXEC_TYPE_META[t] || EXEC_TYPE_META.manual;
  return '<span class="exec-type ' + m.cls + '"><span class="et-ic">' + m.icon + '</span>' + m.text + '</span>';
}
/* 依据案例名称/类型推断执行方式 */
function inferExecType(name){
  if(/接口|API|回调|通知|签名|幂等|压测|性能|并发|路由|连通性|对账|协议|日志/.test(name)) return "auto";
  if(/收银台|页面|首屏|H5|移动端|视觉|UI|走查|弹窗|跳转|渲染|适配/.test(name)) return "ui";
  return "manual";
}

/* ============ 联动下拉 ============ */
function initSubtaskOptions(){
  var sel = document.getElementById("selSubtask");
  sel.innerHTML = SUBTASKS.map(function(s){
    return '<option value="' + s.id + '">' + escapeHtml(s.name) + '</option>';
  }).join("");
  // 先尝试按全局 scope 中保存的子任务名匹配
  if(window.TMSScope){
    var m = TMSScope.pickMatch(SUBTASKS, function(s){ return s.name; }, TMSScope.getSubtaskName());
    if(m) state.subtask = m.id;
  }
  if(!SUBTASKS.find(function(s){ return s.id === state.subtask; })){
    state.subtask = SUBTASKS[0] ? SUBTASKS[0].id : "";
  }
  sel.value = state.subtask;
  if(window.TMSScope){
    var cur = SUBTASKS.find(function(s){ return s.id === state.subtask; });
    if(cur) TMSScope.setSubtaskName(cur.name);
  }
}
function renderStageOptions(){
  var sub = SUBTASKS.find(function(s){ return s.id === state.subtask; });
  var sel = document.getElementById("selStage");
  if(!sub){ sel.innerHTML = ""; sel.disabled = true; return; }
  sel.disabled = false;
  sel.innerHTML = sub.stages.map(function(st){
    return '<option value="' + st.code + '">' + escapeHtml(st.name) + '</option>';
  }).join("");
  if(window.TMSScope){
    var m = TMSScope.pickMatch(sub.stages, function(s){ return s.name; }, TMSScope.getStageName());
    if(m) state.stage = m.code;
  }
  if(!sub.stages.find(function(s){ return s.code === state.stage; })){
    state.stage = sub.stages[0] ? sub.stages[0].code : "";
  }
  sel.value = state.stage;
  if(window.TMSScope){
    var curStage = sub.stages.find(function(s){ return s.code === state.stage; });
    if(curStage) TMSScope.setStageName(curStage.name);
  }
}
function renderRoundOptions(){
  state.rounds = genRounds(state.subtask, state.stage);
  var sel = document.getElementById("selRound");
  if(state.rounds.length === 0){
    sel.innerHTML = '<option value="">（当前阶段暂无轮次）</option>';
    sel.disabled = true;
    state.roundId = "";
    return;
  }
  sel.disabled = false;
  sel.innerHTML = state.rounds.map(function(r){
    var tag = r.status === "done" ? "✓ 已完成"
            : r.status === "active" ? "● 进行中"
            : "○ 未开始";
    return '<option value="' + r.id + '">' + escapeHtml(r.name) +
           ' （' + r.startDate + ' ~ ' + r.endDate + '） ' + tag + '</option>';
  }).join("");
  // 切换子任务/阶段后：优先按全局 scope 的轮次名匹配；其次保留相同轮次若仍存在；再其次“进行中”；最后第 1 个
  var pickedByScope = null;
  if(window.TMSScope){
    pickedByScope = TMSScope.pickMatch(state.rounds, function(r){ return r.name; }, TMSScope.getRoundName());
  }
  var keep = state.rounds.find(function(r){ return r.id === state.roundId; });
  var def = pickedByScope
         || keep
         || state.rounds.find(function(r){ return r.status === "active"; })
         || state.rounds[0];
  state.roundId = def ? def.id : "";
  sel.value = state.roundId;
  if(window.TMSScope && def) TMSScope.setRoundName(def.name);
}

/* ============ 重新构建当前轮次的执行记录 ============ */
function rebuildExecList(){
  var round = state.rounds.find(function(r){ return r.id === state.roundId; });
  if(!round){ state.execList = []; return; }
  var cases = CASE_POOL.filter(function(c){
    return c.subtask === state.subtask && c.stage === state.stage;
  });
  if(!EXECUTIONS[round.id]){
    EXECUTIONS[round.id] = buildExecutionsForRound(round, cases);
  }
  state.execList = EXECUTIONS[round.id];
}

/* ============ 过滤 ============ */
function getFilteredList(){
  var kw = state.kw.trim().toLowerCase();
  return state.execList.filter(function(r){
    if(state.statusIn && state.statusIn.length){
      if(state.statusIn.indexOf(r.status) < 0) return false;
    } else if(state.status && r.status !== state.status){
      return false;
    }
    if(state.priority && r.priority !== state.priority) return false;
    if(state.execType && r.execType !== state.execType) return false;
    if(state.owner && r.owner.name !== state.owner) return false;
    if(state.hasBug === "yes" && r.bugs.length === 0) return false;
    if(state.hasBug === "no" && r.bugs.length > 0) return false;
    if(kw){
      var hay = (r.name + " " + r.caseId + " " + r.owner.name).toLowerCase();
      if(hay.indexOf(kw) < 0) return false;
    }
    return true;
  });
}

/* ============ 概览、进度、meta ============ */
function renderOverview(){
  var list = state.execList;
  var total = list.length;
  var passed = list.filter(function(r){return r.status==="passed";}).length;
  var failed = list.filter(function(r){return r.status==="failed";}).length;
  var blocked = list.filter(function(r){return r.status==="blocked";}).length;
  var skipped = list.filter(function(r){return r.status==="skipped";}).length;
  var pending = list.filter(function(r){return r.status==="pending" || r.status==="running";}).length;
  var executed = passed + failed + blocked + skipped;
  var pct = total === 0 ? 0 : Math.round(executed / total * 100);
  var passPct = total === 0 ? 0 : Math.round(passed / total * 100);
  var failPct = total === 0 ? 0 : Math.round(failed / total * 100);

  document.getElementById("ovTotal").innerText = total;
  document.getElementById("ovPassed").innerText = passed;
  document.getElementById("ovFailed").innerText = failed;
  document.getElementById("ovBlocked").innerText = blocked;
  document.getElementById("ovSkipped").innerText = skipped;
  document.getElementById("ovPending").innerText = pending;
  var passedPctEl = document.getElementById("ovPassedPct");
  var failedPctEl = document.getElementById("ovFailedPct");
  if(passedPctEl) passedPctEl.innerText = passPct + "% 通过率";
  if(failedPctEl) failedPctEl.innerText = failPct + "% 失败率";

  // 进度条
  var bar = document.getElementById("progressBar");
  function seg(cls, n){
    if(total === 0) return "";
    var w = n / total * 100;
    return '<div class="pb-seg ' + cls + '" style="width:' + w + '%"></div>';
  }
  bar.innerHTML = seg("pb-passed", passed) + seg("pb-failed", failed)
                + seg("pb-blocked", blocked) + seg("pb-skipped", skipped);
  document.getElementById("pwPct").innerText = pct + "%";
  document.getElementById("lgPassed").innerText = passed;
  document.getElementById("lgFailed").innerText = failed;
  document.getElementById("lgBlocked").innerText = blocked;
  document.getElementById("lgSkipped").innerText = skipped;

  // meta
  var round = state.rounds.find(function(r){ return r.id === state.roundId; });
  var metaRoundNameEl = document.getElementById("metaRoundName");
  if(metaRoundNameEl) metaRoundNameEl.innerText = round ? round.name : "—";
  var tag = document.getElementById("metaRoundTag");
  if(round){
    if(tag){
      tag.innerText = round.statusText;
      tag.className = "round-tag " + (round.status === "done" ? "tag-done" : round.status === "active" ? "tag-active" : "");
    }
    var estDoneEl = document.getElementById("estDone");
    if(estDoneEl) estDoneEl.innerText = round.endDate;
  }
  var metaTotalEl = document.getElementById("metaTotal");
  if(metaTotalEl) metaTotalEl.innerText = total;
  document.getElementById("titleCount").innerText = total;
}

/* ============ 执行人下拉 ============ */
function renderOwnerOptions(){
  var sel = document.getElementById("fOwner");
  var names = {};
  state.execList.forEach(function(r){ names[r.owner.name] = true; });
  sel.innerHTML = '<option value="">全部执行人</option>' +
    Object.keys(names).map(function(n){
      return '<option value="' + n + '"' + (n === state.owner ? " selected" : "") + '>' + n + '</option>';
    }).join("");
}

/* ============ 表格 ============ */
function renderTable(){
  var list = getFilteredList();
  var total = list.length;
  var totalPages = Math.max(1, Math.ceil(total / state.pageSize));
  if(state.page > totalPages) state.page = totalPages;
  var start = (state.page - 1) * state.pageSize;
  var pageData = list.slice(start, start + state.pageSize);

  var tbody = document.getElementById("caseTbody");
  var empty = document.getElementById("caseEmpty");

  if(pageData.length === 0){
    tbody.innerHTML = "";
    empty.style.display = "block";
  }else{
    empty.style.display = "none";
    tbody.innerHTML = pageData.map(function(r){
      var statusText = {
        pending:"待执行", running:"执行中", passed:"通过",
        failed:"失败", blocked:"阻塞", skipped:"跳过"
      }[r.status];
      var bugsHtml = r.bugs.length === 0
        ? '<span class="no-bug">-</span>'
        : r.bugs.map(function(b){ return '<span class="bug-link">' + b + '</span>'; }).join("");
      var opHtml = r.status === "pending" || r.status === "running"
        ? '<span class="op-link exec">▶ 执行</span><span class="op-link">详情</span><span class="op-link">···</span>'
        : '<span class="op-link">查看</span><span class="op-link exec">重新执行</span><span class="op-link">···</span>';
      return '<tr>' +
        '<td><input type="checkbox" class="row-check"></td>' +
        '<td><span class="case-code">' + highlight(r.caseId, state.kw) + '</span></td>' +
        '<td>' +
          '<div class="case-name">' + highlight(r.name, state.kw) + '</div>' +
          '<div class="case-path">' + escapeHtml(r.path) + '</div>' +
        '</td>' +
        '<td><span class="priority ' + priCls(r.priority) + '">' + r.priority + '</span></td>' +
        '<td>' + renderExecType(r.execType) + '</td>' +
        '<td><span class="exec-status es-' + r.status + '">' + statusText + '</span></td>' +
        '<td>' +
          '<span class="owner-cell">' +
            '<span class="avatar-mini" style="background:' + r.owner.color + '">' + r.owner.short + '</span>' +
            highlight(r.owner.name, state.kw) +
          '</span>' +
        '</td>' +
        '<td><span style="font-size:12px;color:#666">' + r.execTime + '</span></td>' +
        '<td><span style="font-size:12px;color:#666">' + r.duration + '</span></td>' +
        '<td>' + bugsHtml + '</td>' +
        '<td>' + opHtml + '</td>' +
      '</tr>';
    }).join("");
  }
  renderPagination(total, totalPages);
}
function renderPagination(total, totalPages){
  var p = state.page;
  var html = '<span class="pg-total">共 ' + total + ' 条</span>';
  html += '<button class="page-btn" ' + (p === 1 ? "disabled" : "") + ' data-go="prev">‹</button>';
  var pages = [];
  for(var i = 1; i <= totalPages; i++){
    if(i === 1 || i === totalPages || (i >= p - 2 && i <= p + 2)) pages.push(i);
    else if(pages[pages.length - 1] !== "...") pages.push("...");
  }
  pages.forEach(function(pg){
    if(pg === "..."){ html += '<span style="padding:0 4px;color:#999">···</span>'; }
    else html += '<button class="page-btn ' + (pg === p ? "active" : "") + '" data-go="' + pg + '">' + pg + '</button>';
  });
  html += '<button class="page-btn" ' + (p >= totalPages ? "disabled" : "") + ' data-go="next">›</button>';
  html += '<select class="page-size" id="casePageSize">' +
    [10, 20, 50].map(function(n){
      return '<option value="' + n + '" ' + (n === state.pageSize ? "selected" : "") + '>' + n + ' 条/页</option>';
    }).join("") + '</select>';

  var bar = document.getElementById("casePg");
  bar.innerHTML = html;
  bar.querySelectorAll(".page-btn").forEach(function(btn){
    btn.addEventListener("click", function(){
      var go = btn.getAttribute("data-go");
      if(go === "prev") state.page = Math.max(1, state.page - 1);
      else if(go === "next") state.page = Math.min(totalPages, state.page + 1);
      else state.page = parseInt(go, 10);
      renderTable();
    });
  });
  document.getElementById("casePageSize").addEventListener("change", function(e){
    state.pageSize = parseInt(e.target.value, 10);
    state.page = 1;
    renderTable();
  });
}

/* ============ 整体刷新 ============ */
function refreshAll(){
  rebuildExecList();
  renderOwnerOptions();
  renderOverview();
  renderTable();
}

/* ============ 事件 ============ */
function bindEvents(){
  document.getElementById("selSubtask").addEventListener("change", function(e){
    state.subtask = e.target.value;
    if(window.TMSScope){
      var cur = SUBTASKS.find(function(s){ return s.id === state.subtask; });
      if(cur) TMSScope.setSubtaskName(cur.name);
    }
    renderStageOptions();
    renderRoundOptions();
    state.page = 1;
    refreshAll();
  });
  document.getElementById("selStage").addEventListener("change", function(e){
    state.stage = e.target.value;
    if(window.TMSScope){
      var sub = SUBTASKS.find(function(s){ return s.id === state.subtask; });
      var cur = sub && sub.stages.find(function(s){ return s.code === state.stage; });
      if(cur) TMSScope.setStageName(cur.name);
    }
    renderRoundOptions();
    state.page = 1;
    refreshAll();
  });
  document.getElementById("selRound").addEventListener("change", function(e){
    state.roundId = e.target.value;
    state.page = 1;
    refreshAll();
    var r = state.rounds.find(function(x){ return x.id === state.roundId; });
    if(r){
      if(window.TMSScope) TMSScope.setRoundName(r.name);
      showToast("已切换到 " + r.name + "（" + r.statusText + "）");
    }
  });

  // 订阅全局 scope 变化（由其他页面/标签页触发）
  if(window.TMSScope){
    TMSScope.onChange(function(ev){
      if(!ev || !ev.crossTab) return;
      if(ev.field === "subtask"){
        var m = TMSScope.pickMatch(SUBTASKS, function(s){ return s.name; }, ev.to);
        if(m && m.id !== state.subtask){
          state.subtask = m.id;
          document.getElementById("selSubtask").value = state.subtask;
          renderStageOptions();
          renderRoundOptions();
          state.page = 1;
          refreshAll();
        }
      }else if(ev.field === "stage"){
        var sub = SUBTASKS.find(function(s){ return s.id === state.subtask; });
        var mS = sub && TMSScope.pickMatch(sub.stages, function(s){ return s.name; }, ev.to);
        if(mS && mS.code !== state.stage){
          state.stage = mS.code;
          document.getElementById("selStage").value = state.stage;
          renderRoundOptions();
          state.page = 1;
          refreshAll();
        }
      }else if(ev.field === "round"){
        var mR = TMSScope.pickMatch(state.rounds, function(r){ return r.name; }, ev.to);
        if(mR && mR.id !== state.roundId){
          state.roundId = mR.id;
          document.getElementById("selRound").value = state.roundId;
          state.page = 1;
          refreshAll();
        }
      }
    });
  }

  var kw = document.getElementById("caseKw");
  var t = null;
  kw.addEventListener("input", function(){
    clearTimeout(t);
    t = setTimeout(function(){
      state.kw = kw.value;
      state.page = 1;
      renderTable();
    }, 200);
  });

  document.getElementById("fStatus").addEventListener("change", function(e){
    state.status = e.target.value;
    state.statusIn = e.target.value ? [e.target.value] : [];
    if(typeof syncStatCards === "function") syncStatCards();
    state.page = 1; renderTable();
  });
  document.getElementById("fPriority").addEventListener("change", function(e){
    state.priority = e.target.value; state.page = 1; renderTable();
  });
  document.getElementById("fExecType").addEventListener("change", function(e){
    state.execType = e.target.value; state.page = 1; renderTable();
  });
  document.getElementById("fOwner").addEventListener("change", function(e){
    state.owner = e.target.value; state.page = 1; renderTable();
  });
  document.getElementById("fHasBug").addEventListener("change", function(e){
    state.hasBug = e.target.value; state.page = 1; renderTable();
  });
  document.getElementById("caseReset").addEventListener("click", function(){
    document.getElementById("caseKw").value = "";
    document.getElementById("fStatus").value = "";
    document.getElementById("fPriority").value = "";
    document.getElementById("fExecType").value = "";
    document.getElementById("fOwner").value = "";
    document.getElementById("fHasBug").value = "";
    state.kw=""; state.status=""; state.statusIn=[]; state.priority=""; state.execType=""; state.owner=""; state.hasBug="";
    state.page = 1;
    if(typeof syncStatCards === "function") syncStatCards();
    renderTable();
  });

  // 统计卡片点击筛选
  function syncStatCards(){
    var cur = (state.statusIn || []).slice().sort().join(",");
    document.querySelectorAll(".stat-mini[data-stat]").forEach(function(c){
      var s = c.getAttribute("data-stat");
      var arr = (s === "all") ? [] : s.split(",").map(function(x){return x.trim();}).filter(Boolean);
      var key = arr.slice().sort().join(",");
      if(key === cur){ c.classList.add("active"); }
      else { c.classList.remove("active"); }
    });
  }
  document.querySelectorAll(".stat-mini[data-stat]").forEach(function(card){
    card.addEventListener("click", function(){
      var s = card.getAttribute("data-stat");
      var arr = (s === "all") ? [] : s.split(",").map(function(x){return x.trim();}).filter(Boolean);
      var curKey = (state.statusIn || []).slice().sort().join(",");
      var newKey = arr.slice().sort().join(",");
      if(curKey === newKey){
        state.statusIn = []; state.status = "";
      } else {
        state.statusIn = arr;
        state.status = arr.length === 1 ? arr[0] : "";
      }
      var fSel = document.getElementById("fStatus");
      if(fSel) fSel.value = (state.statusIn.length === 1) ? state.statusIn[0] : "";
      state.page = 1;
      syncStatCards();
      renderTable();
    });
  });
  syncStatCards();

  document.getElementById("chkAll").addEventListener("change", function(e){
    document.querySelectorAll(".row-check").forEach(function(c){ c.checked = e.target.checked; });
  });
}

/* ============ 初始化 ============ */
TMSGlobal.mount("#taskSwitcher", { showToast: true });

TMSGlobal.onChange(function(){
  // 全局任务切换 → 重建 subtask/stage/round
  SUBTASKS = resolveSubtasks(TMSGlobal.getCurrentId());
  // 清空执行缓存，避免旧任务数据残留
  EXECUTIONS = {};
  // 重建案例池
  CASE_POOL.length = 0;
  rebuildCasePool();
  state.subtask = SUBTASKS[0] ? SUBTASKS[0].id : "";
  state.stage   = SUBTASKS[0] && SUBTASKS[0].stages[0] ? SUBTASKS[0].stages[0].code : "";
  state.page = 1;
  initSubtaskOptions();
  renderStageOptions();
  renderRoundOptions();
  refreshAll();
});

/* 把案例池构建逻辑封装成函数，便于任务切换后重建 */
function rebuildCasePool(){
  var tpl = {
    "sub-pay-api": {
      smoke: ["创建支付订单-主流程可用","查询订单状态-返回正常","支付回调通知-签名校验"],
      st: [
        "支付订单创建-正常金额","支付订单创建-金额为0","支付订单创建-超过上限金额",
        "支付订单创建-并发幂等","支付渠道路由-默认通道","支付渠道路由-主通道异常降级",
        "退款申请-全额退款","退款申请-部分退款","退款申请-超额拒绝",
        "查询订单-按订单号","查询订单-按商户单号","订单状态机-状态流转校验",
        "支付回调-重复通知幂等","支付回调-签名篡改拒绝"
      ],
      regression: ["历史订单查询兼容","旧版回调协议兼容","MySQL 分库分表路由回归"],
      uat: ["业务方对账单生成","业务方对账差异确认","UAT 环境全链路支付"]
    },
    "sub-cashier": {
      smoke: ["收银台首屏渲染","支付方式切换"],
      st: [
        "收银台-金额展示正确","收银台-优惠券选择","收银台-优惠券互斥校验",
        "收银台-支付方式排序","收银台-超时倒计时","收银台-重复提交拦截",
        "收银台-移动端适配","收银台-网络异常重试"
      ],
      uat: ["业务方收银台走查","视觉还原度验收"]
    },
    "sub-risk": {
      st: [
        "风控规则命中-黑名单拦截","风控规则命中-高风险二次验证",
        "风控规则命中-白名单放行","风控规则-规则优先级","风控规则-异步决策超时兜底"
      ],
      regression: ["历史风控规则兼容","决策日志回归"]
    },
    "sub-channel": {
      smoke: ["银联通道连通性","支付宝通道连通性"],
      st: [
        "银联-代扣签约","银联-代扣支付","银联-代扣解约",
        "支付宝-扫码支付","支付宝-退款","支付宝-异步通知"
      ],
      uat: ["渠道方联调-银联","渠道方联调-支付宝"]
    }
  };
  var i = 0;
  SUBTASKS.forEach(function(sub){
    sub.stages.forEach(function(st){
      var names = (tpl[sub.id] && tpl[sub.id][st.code]) || [
        "示例案例-主流程","示例案例-边界条件","示例案例-异常处理","示例案例-回归兼容"
      ];
      names.forEach(function(nm){
        i++;
        var type = /性能|并发|超时/.test(nm) ? "性能"
                 : /签名|拦截|白名单|黑名单|风控/.test(nm) ? "安全"
                 : /接口|API|回调|通知/.test(nm) ? "接口"
                 : /移动端|适配|兼容/.test(nm) ? "兼容"
                 : "功能";
        var pri = /主流程|签约|回调|首屏|创建|退款|风控|超时|异常|并发/.test(nm) ? "高"
                : /查询|切换|排序/.test(nm) ? "中" : "低";
        CASE_POOL.push(mkCase(i, nm, type, pri, i % OWNERS.length, {
          subId: sub.id, subName: sub.name, stageCode: st.code, stageName: st.name
        }));
      });
    });
  });
}

/* 首次渲染 */
state.subtask = SUBTASKS[0] ? SUBTASKS[0].id : "";
state.stage   = SUBTASKS[0] && SUBTASKS[0].stages[0] ? SUBTASKS[0].stages[0].code : "";
initSubtaskOptions();
renderStageOptions();
renderRoundOptions();
bindEvents();
refreshAll();

/* ===== TMS 扩展注入钩子（浏览器独立运行时仅挂载对象，不影响任何逻辑） ===== */
window.__TMS_HOOKS__ = window.__TMS_HOOKS__ || {};
window.__TMS_HOOKS__.execution = {
  setData: function(arr){
    if(!Array.isArray(arr)) return;
    CASE_POOL.length = 0;
    Array.prototype.push.apply(CASE_POOL, arr);
    refreshAll();
  },
  getData: function(){ return CASE_POOL; }
};
</script>
