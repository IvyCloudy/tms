/* ========== 页面特有样式 ========== */
table{min-width:1360px}
.scope-meta strong{color:#e34d59;font-weight:600;margin:0 3px}

.bug-code{color:#e34d59;cursor:pointer;font-family:"SF Mono","Menlo",monospace;font-size:11.5px;font-weight:600}
.bug-code:hover{text-decoration:underline}
.bug-title{font-weight:500;color:#1a1a1a;display:inline-block;max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.bug-title:hover{color:#0052d9;cursor:pointer}
.bug-meta{font-size:10.5px;color:#999;margin-top:2px}
.bug-meta .dot{margin:0 5px;color:#ddd}

/* 严重程度 */
.severity{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;font-size:10.5px;border-radius:2px;font-weight:500;white-space:nowrap}
.severity::before{content:"";width:6px;height:6px;border-radius:50%;display:inline-block}
.sv-blocker{background:#fde2e3;color:#c52b35}.sv-blocker::before{background:#c52b35}
.sv-critical{background:#fde2e3;color:#e34d59}.sv-critical::before{background:#e34d59}
.sv-major{background:#fff3e0;color:#e37318}.sv-major::before{background:#e37318}
.sv-minor{background:#e8f3ff;color:#0052d9}.sv-minor::before{background:#0052d9}
.sv-trivial{background:#f0f2f5;color:#888}.sv-trivial::before{background:#888}

/* 缺陷状态 */
.bug-status{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;font-size:10.5px;border-radius:2px;font-weight:500;white-space:nowrap}
.bug-status::before{content:"";width:6px;height:6px;border-radius:50%;display:inline-block}
.bs-open{background:#fde2e3;color:#e34d59}.bs-open::before{background:#e34d59}
.bs-fixing{background:#fff3e0;color:#e37318}.bs-fixing::before{background:#e37318;animation:pulse 1.4s infinite}
.bs-fixed{background:#e8f3ff;color:#0052d9}.bs-fixed::before{background:#0052d9}
.bs-verifying{background:#e8f3ff;color:#0052d9}.bs-verifying::before{background:#0052d9;animation:pulse 1.4s infinite}
.bs-closed{background:#e8f8f0;color:#2ba471}.bs-closed::before{background:#2ba471}
.bs-reopened{background:#f3e8ff;color:#7b3fe4}.bs-reopened::before{background:#7b3fe4}
.bs-rejected{background:#f0f2f5;color:#888}.bs-rejected::before{background:#888}

/* 类型 */
.bug-type{display:inline-block;padding:1px 7px;font-size:10.5px;border-radius:2px;font-weight:500;border:1px solid transparent}
.bt-func{background:#e8f3ff;color:#0052d9;border-color:#bdd7ff}
.bt-ui{background:#f3e8ff;color:#7b3fe4;border-color:#dcc8ff}
.bt-perf{background:#fff3e0;color:#e37318;border-color:#ffd9a8}
.bt-sec{background:#fde2e3;color:#e34d59;border-color:#f5c4c8}
.bt-compat{background:#e8f8f0;color:#2ba471;border-color:#bfe7cf}
.bt-other{background:#f0f2f5;color:#666;border-color:#e5e9ef}

.case-link{color:#0052d9;cursor:pointer;font-family:"SF Mono","Menlo",monospace;font-size:11px}
.case-link:hover{text-decoration:underline}
.no-link{color:#bbb}

/* ============ 工具 ============ */
function escapeHtml(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];
  });
}
function highlight(text, kw){
  if(!kw) return escapeHtml(text);
  var esc = escapeHtml(text);
  var re = new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "ig");
  return esc.replace(re, function(m){ return "<mark>" + m + "</mark>"; });
}
function showToast(msg){
  var el = document.getElementById("toast");
  el.innerText = msg;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.remove("show"); }, 1800);
}

  });
});

/* ============ 状态 ============ */
var state = {
  subtask:"",
  scopeStage:"",
  kw:"",
  status:"",
  statusIn: [],
  severity:"",
  priority:"",
  type:"",
  assignee:"",
  page:1,
  pageSize:10
};

var STATUS_META = {
  open:      { text:"待处理",  cls:"bs-open" },
  fixing:    { text:"修复中",  cls:"bs-fixing" },
  fixed:     { text:"已修复",  cls:"bs-fixed" },
  verifying: { text:"验证中",  cls:"bs-verifying" },
  closed:    { text:"已关闭",  cls:"bs-closed" },
  reopened:  { text:"重开",    cls:"bs-reopened" },
  rejected:  { text:"已拒绝",  cls:"bs-rejected" }
};
var SEVERITY_META = {
  blocker:  { text:"致命",  cls:"sv-blocker" },
  critical: { text:"严重",  cls:"sv-critical" },
  major:    { text:"主要",  cls:"sv-major" },
  minor:    { text:"次要",  cls:"sv-minor" },
  trivial:  { text:"轻微",  cls:"sv-trivial" }
};
var TYPE_META = {
  func:   { text:"功能",    cls:"bt-func" },
  ui:     { text:"UI",      cls:"bt-ui" },
  perf:   { text:"性能",    cls:"bt-perf" },
  sec:    { text:"安全",    cls:"bt-sec" },
  compat: { text:"兼容性",  cls:"bt-compat" },
  other:  { text:"其他",    cls:"bt-other" }
};

/* ============ 概览（按当前范围）============ */
function bugsInScope(){
  return BUGS.filter(function(b){
    if(state.subtask && b.subtask !== state.subtask) return false;
    if(state.scopeStage && b.stage !== state.scopeStage) return false;
    return true;
  });
}
function renderOverview(){
  var list = bugsInScope();
  var total    = list.length;
  var open     = list.filter(function(b){return b.status==="open";}).length;
  var fixing   = list.filter(function(b){return b.status==="fixing" || b.status==="fixed";}).length;
  var verifying= list.filter(function(b){return b.status==="verifying";}).length;
  var closed   = list.filter(function(b){return b.status==="closed";}).length;
  var others   = list.filter(function(b){return b.status==="reopened" || b.status==="rejected";}).length;

  document.getElementById("ovTotal").innerText = total;
  document.getElementById("ovOpen").innerText = open;
  document.getElementById("ovFixing").innerText = fixing;
  document.getElementById("ovVerifying").innerText = verifying;
  document.getElementById("ovClosed").innerText = closed;
  document.getElementById("ovOthers").innerText = others;

  var openPct   = total ? Math.round(open / total * 100) : 0;
  var closedPct = total ? Math.round(closed / total * 100) : 0;
  var openPctEl   = document.getElementById("ovOpenPct");
  var closedPctEl = document.getElementById("ovClosedPct");
  if(openPctEl)   openPctEl.innerText   = openPct + "% 占比";
  if(closedPctEl) closedPctEl.innerText = closedPct + "% 解决率";

  var mc = document.getElementById("metaScopeCount");
  if(mc) mc.innerText = total;
}

/* ============ 过滤 ============ */
function getFilteredList(){
  var kw = state.kw.trim().toLowerCase();
  return bugsInScope().filter(function(b){
    if(state.statusIn && state.statusIn.length){
      if(state.statusIn.indexOf(b.status) < 0) return false;
    } else if(state.status && b.status !== state.status){
      return false;
    }
    if(state.severity  && b.severity !== state.severity)  return false;
    if(state.priority  && b.priority !== state.priority)  return false;
    if(state.type      && b.type     !== state.type)      return false;
    if(state.assignee  && b.assigneeObj.name !== state.assignee) return false;
    if(kw){
      var hay = (b.id + " " + b.title + " " + b.module + " " +
                 b.assigneeObj.name + " " + b.reporterObj.name +
                 " " + (b.caseId||"")).toLowerCase();
      if(hay.indexOf(kw) < 0) return false;
    }
    return true;
  });
}

/* ============ 表格 ============ */
function renderTable(){
  var list = getFilteredList();
  document.getElementById("listCount").innerText = list.length;

  var tbody = document.getElementById("tbody");
  if(list.length === 0){
    tbody.innerHTML = '<tr><td colspan="13">' +
      '<div class="empty-state"><div class="empty-icon">◌</div>' +
      '<div class="empty-text">没有匹配的缺陷</div></div></td></tr>';
    document.getElementById("pager").innerHTML = "";
    return;
  }

  var totalPages = Math.max(1, Math.ceil(list.length / state.pageSize));
  if(state.page > totalPages) state.page = totalPages;
  var start = (state.page - 1) * state.pageSize;
  var pageList = list.slice(start, start + state.pageSize);

  var kw = state.kw.trim();
  tbody.innerHTML = pageList.map(function(b){
    var sv = SEVERITY_META[b.severity] || SEVERITY_META.minor;
    var st = STATUS_META[b.status]     || STATUS_META.open;
    var tp = TYPE_META[b.type]         || TYPE_META.other;
    var stageName = STAGE_NAME[b.stage] || b.stage;

    var caseHtml = b.caseId
      ? '<span class="case-link">' + escapeHtml(b.caseId) + '</span>'
      : '<span class="no-link">—</span>';

    return '<tr>' +
      '<td><span class="bug-code">' + highlight(b.id, kw) + '</span></td>' +
      '<td><div><span class="bug-title" title="' + escapeHtml(b.title) + '">' +
        highlight(b.title, kw) + '</span></div>' +
        '<div class="bug-meta">' + escapeHtml(b.module) +
        '<span class="dot">·</span>' + escapeHtml(stageName) + ' / 第 ' + b.round + ' 轮' +
        '</div></td>' +
      '<td><span class="severity ' + sv.cls + '">' + sv.text + '</span></td>' +
      '<td><span class="priority pri-' + b.priority.toLowerCase() + '">' + b.priority + '</span></td>' +
      '<td><span class="bug-type ' + tp.cls + '">' + tp.text + '</span></td>' +
      '<td><span class="bug-status ' + st.cls + '">' + st.text + '</span></td>' +
      '<td>' + highlight(b.module, kw) + '</td>' +
      '<td>' + escapeHtml(stageName) + ' · R' + b.round + '</td>' +
      '<td><div class="owner-cell">' +
        '<span class="avatar-mini ' + b.assigneeObj.cls + '">' + b.assigneeObj.short + '</span>' +
        highlight(b.assigneeObj.name, kw) + '</div></td>' +
      '<td><div class="owner-cell">' +
        '<span class="avatar-mini ' + b.reporterObj.cls + '">' + b.reporterObj.short + '</span>' +
        escapeHtml(b.reporterObj.name) + '</div></td>' +
      '<td>' + caseHtml + '</td>' +
      '<td style="color:#666">' + escapeHtml(b.createdAt) + '</td>' +
      '<td>' +
        '<span class="op-link" data-act="detail" data-id="' + b.id + '">查看</span>' +
        '<span class="op-link" data-act="assign" data-id="' + b.id + '">分配</span>' +
        '<span class="op-link danger" data-act="close" data-id="' + b.id + '">关闭</span>' +
      '</td>' +
    '</tr>';
  }).join("");

  // 分页
  renderPagination(list.length, totalPages);
}

function renderPagination(total, totalPages){
  var pager = document.getElementById("pager");
  var html = '<span class="pg-total">共 ' + total + ' 条</span>';
  html += '<button class="page-btn" data-go="prev"' + (state.page<=1?" disabled":"") + '>‹</button>';
  var s = Math.max(1, state.page - 2);
  var e = Math.min(totalPages, s + 4);
  s = Math.max(1, e - 4);
  for(var i=s; i<=e; i++){
    html += '<button class="page-btn' + (i===state.page?' active':'') + '" data-go="' + i + '">' + i + '</button>';
  }
  html += '<button class="page-btn" data-go="next"' + (state.page>=totalPages?" disabled":"") + '>›</button>';
  html += '<select class="page-size" id="pgSize">' +
            '<option value="10"'  + (state.pageSize===10?  " selected":"") + '>10 条/页</option>' +
            '<option value="20"'  + (state.pageSize===20?  " selected":"") + '>20 条/页</option>' +
            '<option value="50"'  + (state.pageSize===50?  " selected":"") + '>50 条/页</option>' +
          '</select>';
  pager.innerHTML = html;
}

/* ============ 处理人下拉 ============ */
function initAssigneeOptions(){
  var sel = document.getElementById("fAssignee");
  var names = {};
  BUGS.forEach(function(b){ names[b.assigneeObj.name] = true; });
  sel.innerHTML = '<option value="">全部处理人</option>' +
    Object.keys(names).map(function(n){
      return '<option value="' + escapeHtml(n) + '">' + escapeHtml(n) + '</option>';
    }).join("");
}

/* ============ 事件 ============ */
function bindEvents(){
  var kw = document.getElementById("bugKw");
  var t = null;
  kw.addEventListener("input", function(){
    clearTimeout(t);
    t = setTimeout(function(){
      state.kw = kw.value;
      state.page = 1;
      renderTable();
    }, 200);
  });

  [
    ["fStatus",   "status"],
    ["fSeverity", "severity"],
    ["fPriority", "priority"],
    ["fType",     "type"],
    ["fAssignee", "assignee"]
  ].forEach(function(p){
    document.getElementById(p[0]).addEventListener("change", function(e){
      state[p[1]] = e.target.value;
      if(p[1] === "status"){
        state.statusIn = e.target.value ? [e.target.value] : [];
        syncStatCards();
      }
      state.page = 1;
      renderTable();
    });
  });

  // 统计卡片点击筛选
  function syncStatCards(){
    var cur = (state.statusIn || []).slice().sort().join(",");
    document.querySelectorAll(".stat-mini[data-stat]").forEach(function(c){
      var s = c.getAttribute("data-stat");
      var arr = (s === "all") ? [] : s.split(",").map(function(x){return x.trim();}).filter(Boolean);
      var key = arr.slice().sort().join(",");
      if(key === cur){ c.classList.add("active"); }
      else { c.classList.remove("active"); }
    });
  }
  document.querySelectorAll(".stat-mini[data-stat]").forEach(function(card){
    card.addEventListener("click", function(){
      var s = card.getAttribute("data-stat");
      var arr = (s === "all") ? [] : s.split(",").map(function(x){return x.trim();}).filter(Boolean);
      var curKey = (state.statusIn || []).slice().sort().join(",");
      var newKey = arr.slice().sort().join(",");
      if(curKey === newKey){
        // 再次点击取消
        state.statusIn = [];
        state.status = "";
      } else {
        state.statusIn = arr;
        state.status = arr.length === 1 ? arr[0] : "";
      }
      // 同步下拉框（只同步显示，不触发 change 以免覆盖多值）
      var fSel = document.getElementById("fStatus");
      if(fSel){
        fSel.value = (state.statusIn.length === 1) ? state.statusIn[0] : "";
      }
      state.page = 1;
      syncStatCards();
      renderTable();
    });
  });
  syncStatCards();

  // 联动：测试子任务 / 测试阶段
  document.getElementById("selSubtask").addEventListener("change", function(e){
    state.subtask = e.target.value;
    if(window.TMSScope){
      var cur = SUBTASKS.find(function(s){ return s.id === state.subtask; });
      if(cur) TMSScope.setSubtaskName(cur.name);
    }
    renderStageOptions();
    state.page = 1;
    renderOverview();
    renderTable();
  });
  document.getElementById("selStage").addEventListener("change", function(e){
    state.scopeStage = e.target.value;
    if(window.TMSScope){
      var sub = SUBTASKS.find(function(s){ return s.id === state.subtask; });
      var cur = sub && sub.stages.find(function(s){ return s.code === state.scopeStage; });
      if(cur) TMSScope.setStageName(cur.name);
    }
    state.page = 1;
    renderOverview();
    renderTable();
  });

  // 订阅全局 scope 变化（由其他页面/标签页触发）
  if(window.TMSScope){
    TMSScope.onChange(function(ev){
      if(!ev || !ev.crossTab) return;
      if(ev.field === "subtask"){
        var m = TMSScope.pickMatch(SUBTASKS, function(s){ return s.name; }, ev.to);
        if(m && m.id !== state.subtask){
          state.subtask = m.id;
          document.getElementById("selSubtask").value = state.subtask;
          renderStageOptions();
          state.page = 1;
          renderOverview();
          renderTable();
        }
      }else if(ev.field === "stage"){
        var sub = SUBTASKS.find(function(s){ return s.id === state.subtask; });
        var mS = sub && TMSScope.pickMatch(sub.stages, function(s){ return s.name; }, ev.to);
        if(mS && mS.code !== state.scopeStage){
          state.scopeStage = mS.code;
          document.getElementById("selStage").value = state.scopeStage;
          state.page = 1;
          renderOverview();
          renderTable();
        }
      }
    });
  }

  document.getElementById("btnReset").addEventListener("click", function(){
    state.kw = ""; state.status = ""; state.statusIn = []; state.severity = "";
    state.priority = ""; state.type = "";
    state.assignee = ""; state.page = 1;
    document.getElementById("bugKw").value = "";
    ["fStatus","fSeverity","fPriority","fType","fAssignee"].forEach(function(id){
      document.getElementById(id).value = "";
    });
    if(typeof syncStatCards === "function") syncStatCards();
    renderTable();
    showToast("已重置筛选条件");
  });

  var btnAdd = document.getElementById("btnAddBug");
  if(btnAdd){
    btnAdd.addEventListener("click", function(){
      showToast("打开新增缺陷表单");
    });
  }

  // 分页
  document.getElementById("pager").addEventListener("click", function(e){
    var b = e.target.closest(".page-btn");
    if(!b || b.disabled) return;
    var go = b.getAttribute("data-go");
    var totalPages = Math.max(1, Math.ceil(getFilteredList().length / state.pageSize));
    if(go === "prev") state.page = Math.max(1, state.page - 1);
    else if(go === "next") state.page = Math.min(totalPages, state.page + 1);
    else state.page = parseInt(go, 10);
    renderTable();
  });
  document.getElementById("pager").addEventListener("change", function(e){
    if(e.target && e.target.id === "pgSize"){
      state.pageSize = parseInt(e.target.value, 10);
      state.page = 1;
      renderTable();
    }
  });

  // 表格操作
  document.getElementById("tbody").addEventListener("click", function(e){
    var el = e.target.closest(".op-link, .bug-code, .bug-title, .case-link");
    if(!el) return;
    var id = el.getAttribute("data-id") || el.innerText;
    if(el.classList.contains("op-link")){
      var act = el.getAttribute("data-act");
      if(act === "detail") showToast("打开缺陷详情：" + id);
      else if(act === "assign") showToast("分配缺陷：" + id);
      else if(act === "close") showToast("关闭缺陷：" + id);
    } else if(el.classList.contains("case-link")){
      showToast("跳转到关联案例：" + el.innerText);
    } else {
      showToast("打开缺陷详情：" + id);
    }
  });
}

/* ============ 子任务 / 阶段 下拉 ============ */
function initSubtaskOptions(){
  var sel = document.getElementById("selSubtask");
  sel.innerHTML = SUBTASKS.map(function(s){
    return '<option value="' + s.id + '">' + escapeHtml(s.name) + '</option>';
  }).join("");
  // 先尝试按全局 scope 中保存的子任务名匹配
  if(window.TMSScope){
    var m = TMSScope.pickMatch(SUBTASKS, function(s){ return s.name; }, TMSScope.getSubtaskName());
    if(m) state.subtask = m.id;
  }
  if(!SUBTASKS.find(function(s){ return s.id === state.subtask; })){
    state.subtask = SUBTASKS[0] ? SUBTASKS[0].id : "";
  }
  sel.value = state.subtask;
  if(window.TMSScope){
    var cur = SUBTASKS.find(function(s){ return s.id === state.subtask; });
    if(cur) TMSScope.setSubtaskName(cur.name);
  }
}
function renderStageOptions(){
  var sub = SUBTASKS.find(function(s){ return s.id === state.subtask; });
  var sel = document.getElementById("selStage");
  if(!sub){ sel.innerHTML = ""; sel.disabled = true; return; }
  sel.disabled = false;
  sel.innerHTML = sub.stages.map(function(st){
    return '<option value="' + st.code + '">' + escapeHtml(st.name) + '</option>';
  }).join("");
  // 先尝试按全局 scope 中保存的阶段名匹配
  if(window.TMSScope){
    var m = TMSScope.pickMatch(sub.stages, function(s){ return s.name; }, TMSScope.getStageName());
    if(m) state.scopeStage = m.code;
  }
  if(!sub.stages.find(function(s){ return s.code === state.scopeStage; })){
    state.scopeStage = sub.stages[0] ? sub.stages[0].code : "";
  }
  sel.value = state.scopeStage;
  if(window.TMSScope){
    var curStage = sub.stages.find(function(s){ return s.code === state.scopeStage; });
    if(curStage) TMSScope.setStageName(curStage.name);
  }
}

/* ============ 初始化 ============ */
document.addEventListener("DOMContentLoaded", function(){
  // 顶部任务切换（全局）
  if(window.TMSGlobal){
    if(typeof TMSGlobal.mount === "function"){
      TMSGlobal.mount("#taskSwitcher", { showToast: true });
    } else if(typeof TMSGlobal.mountSwitcher === "function"){
      TMSGlobal.mountSwitcher(document.getElementById("taskSwitcher"));
    }
    TMSGlobal.onChange(function(){
      SUBTASKS = resolveSubtasks(TMSGlobal.getCurrentId());
      state.subtask = SUBTASKS[0] ? SUBTASKS[0].id : "";
      state.scopeStage = SUBTASKS[0] && SUBTASKS[0].stages[0] ? SUBTASKS[0].stages[0].code : "";
      state.page = 1;
      initSubtaskOptions();
      renderStageOptions();
      renderOverview();
      renderTable();
      showToast("任务已切换，缺陷列表已刷新");
    });
  } else {
    var cur = document.querySelector(".task-switcher .ts-current");
    if(cur) cur.innerText = "T001 · 支付业务 2026Q2 迭代测试";
  }

  // 默认选中第一个子任务 + 阶段
  state.subtask    = SUBTASKS[0] ? SUBTASKS[0].id : "";
  state.scopeStage = SUBTASKS[0] && SUBTASKS[0].stages[0] ? SUBTASKS[0].stages[0].code : "";
  initSubtaskOptions();
  renderStageOptions();

  initAssigneeOptions();
  renderOverview();
  renderTable();
  bindEvents();
});

/* ===== TMS 扩展注入钩子（浏览器独立运行时仅挂载对象，不影响任何逻辑） ===== */
window.__TMS_HOOKS__ = window.__TMS_HOOKS__ || {};
window.__TMS_HOOKS__.defect = {
  setData: function(arr){
    if(!Array.isArray(arr)) return;
    var mapped = arr.map(function(b){
      if(b && b.assigneeObj) return b;
      return Object.assign({}, b, {
        assigneeObj: pickOwner(b.assignee),
        reporterObj: pickOwner(b.reporter),
        subtask: MODULE_TO_SUBTASK[b.module] || "sub-pay-api"
      });
    });
    BUGS.length = 0;
    Array.prototype.push.apply(BUGS, mapped);
    renderOverview();
    renderTable();
  },
  getData: function(){ return BUGS; }
};
